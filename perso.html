 je prêche, Dieu jugera par Jésus-Christ le comportement secret des hommes.", "Toi qui te donnes le nom de Juif, tu te reposes sur la loi, tu places ta fierté dans ton Dieu,", "tu connais sa volonté et tu discernes ce qui est important, car tu es instruit par la loi.", "Tu es convaincu d'être le conducteur des aveugles, la lumière de ceux qui sont dans les ténèbres,", "l'éducateur des ignorants, le maître des enfants parce que tu possèdes dans la loi l'expression de la connaissance et de la vérité.", "Toi donc qui enseignes les autres, tu ne t'enseignes pas toi-même! Toi qui prêches de ne pas voler, tu voles!", "Toi qui dis de ne pas commettre d'adultère, tu commets l'adultère! Toi qui as les idoles en horreur, tu pilles les temples!", "Toi qui places ta fierté dans la loi, tu déshonores Dieu en la transgressant!", "En effet, le nom de Dieu est blasphémé parmi les nations à cause de vous, comme cela est écrit.", "Certes, la circoncision est utile si tu mets en pratique la loi; mais si tu la violes, ta circoncision devient incirconcision.", "Si donc l'incirconcis respecte les commandements de la loi, son incirconcision ne sera-t-elle pas comptée comme circoncision?", "Ainsi, l'homme qui accomplit la loi sans être circoncis physiquement ne te condamnera-t-il pas, toi qui la transgresses tout en ayant la loi écrite et la circoncision?", "Le Juif, ce n'est pas celui qui en a l’apparence, et la circoncision, ce n'est pas celle qui est visible dans le corps.", "Mais le Juif, c'est celui qui l'est intérieurement, et la circoncision, c'est celle du cœur, accomplie par l'Esprit et non par la loi écrite. La louange que reçoit ce Juif ne vient pas des hommes, mais de Dieu."], "Romains 12": ["Je vous encourage donc, frères et sœurs, par les compassions de Dieu, à offrir votre corps comme un sacrifice vivant, saint, agréable à Dieu. Ce sera de votre part un culte raisonnable.", "Ne vous conformez pas au monde actuel, mais soyez transformés par le renouvellement de l’intelligence afin de discerner quelle est la volonté de Dieu, ce qui est bon, agréable et parfait.", "Par la grâce qui m'a été donnée, je dis à chacun de vous de ne pas avoir une trop haute opinion de lui-même, mais de garder des sentiments modestes, chacun selon la mesure de foi que Dieu lui a donnée.", "En effet, de même que nous avons plusieurs membres dans un seul corps et que tous les membres n'ont pas la même fonction,", "de même, nous qui sommes plusieurs, nous formons un seul corps en Christ et nous sommes tous membres les uns des autres, chacun pour sa part.", "Nous avons des dons différents, selon la grâce qui nous a été accordée. Si quelqu’un a le don de prophétie, qu'il l'exerce en accord avec la foi;", "si un autre est appelé à servir, qu'il se consacre à son service. Que celui qui enseigne se donne à son enseignement,", "et celui qui a le don d’encourager à l'encouragement. Que celui qui donne le fasse avec générosité, celui qui préside, avec zèle, et que celui qui exerce la bienveillance le fasse avec joie.", "Que l'amour soit sans hypocrisie. Ayez le mal en horreur, attachez-vous au bien.", "Par amour fraternel soyez pleins d'affection les uns pour les autres et rivalisez d'estime réciproque.", "Ayez du zèle, et non de la paresse. Soyez fervents d'esprit et servez le Seigneur.", "Réjouissez-vous dans l'espérance et soyez patients dans la détresse. Persévérez dans la prière.", "Pourvoyez aux besoins des saints et exercez l'hospitalité avec empressement.", "Bénissez ceux qui vous persécutent, bénissez et ne maudissez pas.", "Réjouissez-vous avec ceux qui se réjouissent, pleurez avec ceux qui pleurent.", "Vivez en plein accord les uns avec les autres. N'aspirez pas à ce qui est élevé, mais laissez-vous attirer par ce qui est humble. Ne vous prenez pas pour des sages.", "Ne rendez à personne le mal pour le mal. Recherchez ce qui est bien devant tous les hommes.", "Si cela est possible, dans la mesure où cela dépend de vous, soyez en paix avec tous les hommes.", "Ne vous vengez pas vous-mêmes, bien-aimés, mais laissez agir la colère de Dieu, car il est écrit: C’est à moi qu’appartient la vengeance, c’est moi qui donnerai à chacun ce qu’il mérite, dit le Seigneur.", "Mais si ton ennemi a faim, donne-lui à manger, s'il a soif, donne-lui à boire, car en agissant ainsi, tu amasseras des charbons ardents sur sa tête.", "Ne te laisse pas vaincre par le mal, mais sois vainqueur du mal par le bien."], "Romains 13": ["Que chacun se soumette aux autorités qui nous gouvernent, car toute autorité vient de Dieu, et celles qui existent ont été établies par Dieu.", "C'est pourquoi celui qui s'oppose à l'autorité résiste à l'ordre que Dieu a établi, et ceux qui résistent attireront une condamnation sur eux-mêmes.", "En effet, on n’a pas à craindre les magistrats quand on fait le bien, mais quand on fait le mal. Veux-tu ne pas avoir à craindre l'autorité? Fais le bien et tu auras son approbation,", "car le magistrat est serviteur de Dieu pour ton bien. Mais si tu fais le mal, sois dans la crainte. En effet, ce n'est pas pour rien qu'il porte l'épée, puisqu'il est serviteur de Dieu pour manifester sa colère en punissant celui qui fait le mal.", "Il est donc nécessaire de se soumettre aux autorités, non seulement à cause de cette colère, mais encore par motif de conscience.", "C'est aussi pour cela que vous payez des impôts, car les magistrats sont des serviteurs de Dieu qui s'appliquent entièrement à cette fonction.", "Rendez à chacun ce qui lui est dû: l'impôt à qui vous devez l'impôt, la taxe à qui vous devez la taxe, le respect à qui vous devez le respect, l'honneur à qui vous devez l'honneur.", "Ne devez rien à personne, si ce n'est de vous aimer les uns les autres, car celui qui aime les autres a accompli la loi.", "En effet, les commandements: Tu ne commettras pas d'adultère, tu ne commettras pas de meurtre, tu ne commettras pas de vol, tu ne porteras pas de faux témoignage, tu ne convoiteras pas, ainsi que tous les autres, se résument dans cette parole: Tu aimeras ton prochain comme toi-même.", "L'amour ne fait pas de mal au prochain; l'amour est donc l'accomplissement de la loi.", "Cela est d'autant plus important que vous savez quel temps nous vivons: c'est l'heure de vous réveiller enfin du sommeil, car maintenant le salut est plus près de nous qu’au moment où nous avons cru.", "La nuit est bien avancée, le jour approche. Débarrassons-nous donc des œuvres des ténèbres et revêtons les armes de la lumière.", "Conduisons-nous honnêtement, comme en plein jour, sans orgies ni ivrognerie, sans immoralité ni débauche, sans dispute ni jalousie.", "Mais revêtez-vous du Seigneur Jésus-Christ et ne vous préoccupez pas de votre nature propre pour satisfaire ses convoitises."], "Colossiens 3": ["Si donc vous êtes ressuscités avec Christ, recherchez les choses d'en haut, où Christ est assis à la droite de Dieu.", "Attachez-vous aux réalités d'en haut, et non à celles qui sont sur la terre.", "En effet, vous avez connu la mort et votre vie est cachée avec Christ en Dieu.", "Quand Christ, notre vie, apparaîtra, alors vous apparaîtrez aussi avec lui dans la gloire.", "Faites donc mourir en vous ce qui est terrestre: l’immoralité sexuelle, l'impureté, les passions, les mauvais désirs et la soif de posséder, qui est une idolâtrie.", "C'est à cause de cela que la colère de Dieu vient [sur les hommes rebelles].", "Vous aussi autrefois, lorsque vous viviez parmi eux, vous marchiez dans ces péchés.", "Mais maintenant, renoncez à tout cela, à la colère, à la fureur, à la méchanceté, à la calomnie, aux grossièretés qui pourraient sortir de votre bouche.", "Ne vous mentez pas les uns aux autres, car vous vous êtes dépouillés du vieil homme et de ses manières d’agir,", "vous avez revêtu l'homme nouveau qui se renouvelle pour parvenir à la vraie connaissance, conformément à l'image de celui qui l'a créé.", "Il n'y a plus ni Juif ni non-Juif, ni circoncis ni incirconcis, ni étranger, ni sauvage, ni esclave ni homme libre, mais Christ est tout et en tous.", "Ainsi donc, en tant qu’êtres choisis par Dieu, saints et bien-aimés, revêtez-vous de sentiments de compassion, de bonté, d'humilité, de douceur, de patience.", "Supportez-vous les uns les autres et, si l'un de vous a une raison de se plaindre d’un autre, pardonnez-vous réciproquement. Tout comme Christ vous a pardonné, pardonnez-vous aussi.", "Mais par-dessus tout cela, revêtez-vous de l'amour, qui est le lien de la perfection.", "Que la paix de Christ, à laquelle vous avez été appelés pour former un seul corps, règne dans votre cœur. Et soyez reconnaissants.", "Que la parole de Christ habite en vous dans toute sa richesse! Instruisez-vous et avertissez-vous les uns les autres en toute sagesse par des psaumes, par des hymnes, par des cantiques spirituels, chantez pour le Seigneur de tout votre cœur sous l'inspiration de la grâce.", "Et quoi que vous fassiez, en parole ou en acte, faites tout au nom du Seigneur Jésus en exprimant par lui votre reconnaissance à Dieu le Père."], "Romains 14": ["Accueillez celui qui est faible dans la foi sans discuter ses opinions.", "L'un a la conviction de pouvoir manger de tout; l'autre, qui est faible dans la foi, ne mange que des légumes.", "Que celui qui mange de tout ne méprise pas celui qui ne le fait pas, et que celui qui ne mange pas de tout ne juge pas celui qui le fait, car Dieu l'a accueilli.", "Qui es-tu pour juger le serviteur d'un autre? Qu'il tienne bon ou qu'il tombe, cela regarde son seigneur. Mais il tiendra bon, car Dieu a le pouvoir de l'affermir.", "L'un fait une différence entre les jours, un autre les estime tous égaux. Que chacun ait dans son esprit une pleine conviction.", "Celui qui fait une distinction entre les jours le fait pour le Seigneur [et celui qui ne fait pas de distinction le fait aussi pour le Seigneur]. Celui qui mange de tout, c’est pour le Seigneur qu’il le fait, puisqu’il exprime sa reconnaissance à Dieu. Celui qui ne mange pas de tout le fait aussi pour le Seigneur, et il est reconnaissant envers Dieu.", "En effet, aucun de nous ne vit pour lui-même et aucun ne meurt pour lui-même:", "si nous vivons, c'est pour le Seigneur que nous vivons, et si nous mourons, c'est pour le Seigneur que nous mourons. Ainsi, soit que nous vivions, soit que nous mourions, nous appartenons au Seigneur.", "En effet, Christ est mort et [il est ressuscité,] il est revenu à la vie pour être le Seigneur des morts et des vivants.", "Mais toi, pourquoi juges-tu ton frère? Ou toi, pourquoi méprises-tu ton frère? Nous comparaîtrons tous, en effet, devant le tribunal de Christ,", "car il est écrit: Je suis vivant, dit le Seigneur, chacun pliera le genou devant moi et toute langue rendra gloire à Dieu.", "Ainsi donc, chacun de nous rendra compte à Dieu pour lui-même.", "Ne nous jugeons donc plus les uns les autres, mais veillez plutôt à ne pas placer d’obstacle ou de piège devant votre frère.", "Je sais et je suis convaincu dans le Seigneur Jésus que rien n'est impur en soi, mais si quelqu’un considère telle chose comme impure, alors elle est impure pour lui.", "Si ton frère est attristé à cause de ce que tu manges, tu ne marches plus selon l'amour. Ne cause pas, par ta nourriture, la perte de celui pour lequel Christ est mort.", "Que ce qui est bon pour vous ne devienne pas un sujet de calomnie.", "En effet, le royaume de Dieu, ce n'est pas le manger et le boire, mais la justice, la paix et la joie, par le Saint-Esprit.", "Celui qui sert Christ de cette manière est agréable à Dieu et approuvé des hommes.", "Ainsi donc, recherchons ce qui contribue à entretenir la paix et à nous faire grandir mutuellement dans la foi.", "Pour de la nourriture, ne détruis pas l'œuvre de Dieu. Certes, tout est pur, mais il est mal de manger quelque chose si cela représente un obstacle pour quelqu’un.", "Il est bien de ne pas manger de viande, de ne pas boire de vin et de t'abstenir de ce qui peut être pour ton frère un obstacle, [un piège ou une source de faiblesse].", "Cette foi que tu as, garde-la pour toi devant Dieu. Heureux celui qui ne se condamne pas lui-même par ce qu'il approuve!", "Mais celui qui a des doutes au sujet de ce qu'il mange est condamné, parce qu'il n'agit pas par une conviction de foi. Tout ce qui ne provient pas d’une conviction de foi est péché."], "Romains 15": ["Nous qui sommes forts, nous avons le devoir de supporter les faiblesses de ceux qui ne le sont pas et de ne pas rechercher ce qui nous plaît.", "Que chacun de nous cherche à plaire à son prochain pour son bien, en vue de le faire grandir dans la foi.", "En effet, Christ n'a pas recherché ce qui lui plaisait, mais, comme il est écrit, les injures de ceux qui t'insultent sont tombées sur moi.", "Or tout ce qui a été écrit d'avance l'a été pour notre instruction afin que, par la persévérance et par le réconfort que donnent les Ecritures, nous possédions l'espérance.", "Que le Dieu de la persévérance et du réconfort vous donne de vivre en plein accord les uns avec les autres comme le veut Jésus-Christ,", "afin que tous ensemble, d'une seule voix, vous rendiez gloire au Dieu et Père de notre Seigneur Jésus-Christ.", "Accueillez-vous donc les uns les autres comme Christ vous a accueillis, pour la gloire de Dieu.", "J’affirme [en effet] que [Jésus-]Christ est devenu le serviteur des circoncis pour prouver que Dieu est vrai en confirmant les promesses faites à leurs ancêtres.", "Quant aux non-Juifs, ils célèbrent Dieu à cause de sa bonté, comme le dit l’Ecriture: C'est pourquoi je te louerai parmi les nations et je chanterai à la gloire de ton nom.", "Il est dit encore: Nations, réjouissez-vous avec son peuple!", "et encore: Louez le Seigneur, vous toutes les nations, célébrez-le, vous tous les peuples!", "Esaïe dit aussi: Il paraîtra, le rejeton d'Isaï, il se lèvera pour régner sur les nations; les nations espéreront en lui", "Que le Dieu de l'espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous débordiez d’espérance, par la puissance du Saint-Esprit!", "En ce qui vous concerne, mes frères et sœurs, je suis personnellement convaincu que vous êtes pleins de bonnes dispositions, remplis de toute connaissance et capables de vous avertir les uns les autres.", "Cependant, [frères et sœurs,] c’est avec une certaine audace que je vous ai écrit par endroits, comme pour réveiller vos souvenirs, et cela à cause de la grâce que Dieu m'a faite", "d'être serviteur de Jésus-Christ pour les non-Juifs. Je m'acquitte ainsi du service sacré de la prédication de l'Evangile de Dieu afin que les non-Juifs soient une offrande agréable, devenue sainte par l’action de l'Esprit saint.", "Je peux donc me montrer fier en Jésus-Christ de l'œuvre de Dieu.", "En effet, je n'oserais rien mentionner si Christ ne l’avait pas accompli par moi pour amener les non-Juifs à l'obéissance par la parole et par les actes,", "par la puissance des signes et des prodiges et par la puissance de l'Esprit de Dieu. Ainsi, depuis Jérusalem et en rayonnant jusqu'en Illyrie, j'ai abondamment propagé l'Evangile de Christ.", "Je me suis fait un point d'honneur d'annoncer l'Evangile là où Christ n'avait pas été annoncé, afin de ne pas construire sur les fondations posées par un autre, mais comme il est écrit:", "Ceux à qui il n'avait pas été annoncé verront, et ceux qui n'en avaient pas entendu parler comprendront.", "C'est aussi ce qui m'a souvent empêché d'aller chez vous.", "Mais maintenant, comme je n'ai plus rien qui me retienne dans ces régions et que, depuis bien des années, j'ai le vif désir de vous rendre visite,", "[je le ferai] quand je me rendrai en Espagne. J'espère en effet vous voir en passant et recevoir votre aide pour me rendre là-bas une fois que j'aurai satisfait, du moins en partie, mon désir d'être avec vous.", "Maintenant je vais à Jérusalem pour servir les saints.", "En effet, les Eglises de la Macédoine et l'Achaïe ont bien voulu organiser une collecte en faveur de ceux qui sont pauvres parmi les saints de Jérusalem.", "Elles l'ont bien voulu et elles le leur devaient, car si les non-Juifs ont eu part aux avantages spirituels des Juifs, ils doivent aussi les assister dans leurs besoins matériels.", "Dès que j'aurai réglé cette affaire et que je leur aurai remis ces dons, je partirai pour l'Espagne et je passerai chez vous.", "Je sais qu'en venant vous rendre visite, c'est avec une pleine bénédiction de [l'Evangile de] Christ que je le ferai.", "Je vous en supplie, frères et sœurs, par notre Seigneur Jésus-Christ et par l'amour de l'Esprit, combattez avec moi en adressant à Dieu des prières en ma faveur.", "Priez afin que je sois protégé des incrédules de la Judée et que l’aide que j'apporte à Jérusalem soit bien accueillie par les saints.", "Ainsi je pourrai venir chez vous dans la joie, si c'est la volonté de Dieu, et trouver un peu de repos au milieu de vous.", "Que le Dieu de la paix soit avec vous tous! Amen!"]};

s richesses de sa bonté, de sa patience et de sa générosité en ne reconnaissant pas que la bonté de Dieu te pousse à changer d’attitude?"},{"id":"1sgeidv","cat":"Quel verset ?","q":"Dans quel verset lit-on « … qui prêches de ne pas voler … » ?","o":["Verset 20","Verset 21","Verset 22","Verset 23"],"r":1,"v":[["Romains 2",21],["Romains 2",22],["Romains 2",20],["Romains 2",23]],"x":"Toi donc qui enseignes les autres, tu ne t'enseignes pas toi-même! Toi qui prêches de ne pas voler, tu voles!"},{"id":"1o4li3o","cat":"Quel verset ?","q":"Quel verset commence par « Toi qui dis de ne pas… » ?","o":["Verset 20","Verset 22","Verset 24","Verset 25"],"r":1,"v":[["Romains 2",22],["Romains 2",20],["Romains 2",24],["Romains 2",25]],"x":"Toi qui dis de ne pas commettre d'adultère, tu commets l'adultère! Toi qui as les idoles en horreur, tu pilles les temples!"},{"id":"1j62jhb","cat":"Quel verset ?","q":"Quel verset commence par « Tu es convaincu d'être le conducteur… » ?","o":["Verset 18","Verset 19","Verset 21","Verset 22"],"r":1,"v":[["Romains 2",19],["Romains 2",18],["Romains 2",22],["Romains 2",21]],"x":"Tu es convaincu d'être le conducteur des aveugles, la lumière de ceux qui sont dans les ténèbres,"},{"id":"6mess0","cat":"Quel verset ?","q":"Quel verset commence par « Si donc l'incirconcis respecte les commandements… » ?","o":["Verset 23","Verset 24","Verset 26","Verset 28"],"r":2,"v":[["Romains 2",26],["Romains 2",28],["Romains 2",23],["Romains 2",24]],"x":"Si donc l'incirconcis respecte les commandements de la loi, son incirconcision ne sera-t-elle pas comptée comme circoncision?"},{"id":"b1966w","cat":"Quel verset ?","q":"Quel verset commence par « Et penses-tu, toi qui juges les… » ?","o":["Verset 2","Verset 3","Verset 5","Verset 6"],"r":1,"v":[["Romains 2",3],["Romains 2",2],["Romains 2",6],["Romains 2",5]],"x":"Et penses-tu, toi qui juges les auteurs de tels actes et qui les fais aussi, que tu échapperas au jugement de Dieu?"},{"id":"167movn","cat":"Quel verset ?","q":"Quel verset commence par « Qui que tu sois, homme, toi… » ?","o":["Verset 1","Verset 2","Verset 3","Verset 4"],"r":0,"v":[["Romains 2",1],["Romains 2",4],["Romains 2",2],["Romains 2",3]],"x":"Qui que tu sois, homme, toi qui juges, tu es donc inexcusable. En effet, en jugeant les autres tu te condamnes toi-même, puisque toi qui juges tu agis comme eux."},{"id":"1cqb17l","cat":"Quel verset ?","q":"Quel verset commence par « En effet, ce ne sont pas… » ?","o":["Verset 12","Verset 13","Verset 14","Verset 16"],"r":1,"v":[["Romains 2",13],["Romains 2",16],["Romains 2",12],["Romains 2",14]],"x":"En effet, ce ne sont pas ceux qui écoutent la loi qui sont justes devant Dieu, mais ce sont ceux qui la mettent en pratique qui seront déclarés justes."},{"id":"1ivfi49","cat":"Quel verset ?","q":"Quel verset commence par « Toi qui te donnes le nom… » ?","o":["Verset 14","Verset 17","Verset 18","Verset 20"],"r":1,"v":[["Romains 2",17],["Romains 2",18],["Romains 2",14],["Romains 2",20]],"x":"Toi qui te donnes le nom de Juif, tu te reposes sur la loi, tu places ta fierté dans ton Dieu,"},{"id":"glg9wl","cat":"Quel verset ?","q":"Quel verset commence par « Certes, la circoncision est utile si… » ?","o":["Verset 22","Verset 23","Verset 25","Verset 27"],"r":2,"v":[["Romains 2",25],["Romains 2",27],["Romains 2",22],["Romains 2",23]],"x":"Certes, la circoncision est utile si tu mets en pratique la loi; mais si tu la violes, ta circoncision devient incirconcision."},{"id":"xnca0w","cat":"Quel verset ?","q":"Quel verset commence par « Mais le Juif, c'est celui qui… » ?","o":["Verset 26","Verset 27","Verset 28","Verset 29"],"r":3,"v":[["Romains 2",29],["Romains 2",28],["Romains 2",27],["Romains 2",26]],"x":"Mais le Juif, c'est celui qui l'est intérieurement, et la circoncision, c'est celle du cœur, accomplie par l'Esprit et non par la loi écrite. La louange que reçoit ce Juif ne vient pas des hommes, mais de Dieu."},{"id":"1lgffxq","cat":"Quel verset ?","q":"Dans quel verset lit-on « … tu possèdes dans la loi l'expression … » ?","o":["Verset 18","Verset 20","Verset 21","Verset 23"],"r":1,"v":[["Romains 2",20],["Romains 2",21],["Romains 2",23],["Romains 2",18]],"x":"l'éducateur des ignorants, le maître des enfants parce que tu possèdes dans la loi l'expression de la connaissance et de la vérité."},{"id":"1hgil09","cat":"Quel verset ?","q":"Dans quel verset lit-on « … qui la transgresses tout en ayant … » ?","o":["Verset 24","Verset 25","Verset 27","Verset 29"],"r":2,"v":[["Romains 2",27],["Romains 2",24],["Romains 2",25],["Romains 2",29]],"x":"Ainsi, l'homme qui accomplit la loi sans être circoncis physiquement ne te condamnera-t-il pas, toi qui la transgresses tout en ayant la loi écrite et la circoncision?"},{"id":"8ohc0","cat":"Quel verset ?","q":"Quel verset commence par « Par ton endurcissement et ton refus… » ?","o":["Verset 2","Verset 3","Verset 5","Verset 8"],"r":2,"v":[["Romains 2",5],["Romains 2",2],["Romains 2",3],["Romains 2",8]],"x":"Par ton endurcissement et ton refus de te repentir, tu t'amasses un trésor de colère pour le jour où Dieu révélera sa colère et son juste jugement."},{"id":"1jfg33p","cat":"Quel verset ?","q":"Quel verset commence par « tu connais sa volonté et tu… » ?","o":["Verset 15","Verset 18","Verset 19","Verset 21"],"r":1,"v":[["Romains 2",18],["Romains 2",21],["Romains 2",19],["Romains 2",15]],"x":"tu connais sa volonté et tu discernes ce qui est important, car tu es instruit par la loi."},{"id":"jpjgwo","cat":"Quel verset ?","q":"Dans quel verset lit-on « … être humain qui fait le mal … » ?","o":["Verset 6","Verset 9","Verset 11","Verset 12"],"r":1,"v":[["Romains 2",9],["Romains 2",12],["Romains 2",11],["Romains 2",6]],"x":"La détresse et l’angoisse atteindront tout être humain qui fait le mal, le Juif d’abord, mais aussi le non-Juif."},{"id":"6dk0d1","cat":"Quel verset ?","q":"Dans quel verset lit-on « … des aveugles, la lumière de ceux … » ?","o":["Verset 16","Verset 18","Verset 19","Verset 20"],"r":2,"v":[["Romains 13) ?","o":["Verset 3","Verset 4","Verset 5","Verset 7"],"r":2,"v":[["Romains 13",5],["Romains 13",4],["Romains 13",7],["Romains 13",3]],"x":"Il est donc nécessaire de se soumettre aux autorités, non seulement à cause de cette colère, mais encore par motif de conscience."},{"id":"d96w8v","cat":"Quel verset ?","q":"Dans quel verset lit-on « … ni incirconcis, ni étranger, ni sauvage … » (Col 3) ?","o":["Verset 11","Verset 12","Verset 13","Verset 14"],"r":0,"v":[["Colossiens 3",11],["Colossiens 3",12],["Colossiens 3",13],["Colossiens 3",14]],"x":"Il n'y a plus ni Juif ni non-Juif, ni circoncis ni incirconcis, ni étranger, ni sauvage, ni esclave ni homme libre, mais Christ est tout et en tous."},{"id":"1fjrfhv","cat":"Quel verset ?","q":"Dans quel verset lit-on « … ivrognerie, sans immoralité ni débauche, sans … » (Rm 13) ?","o":["Verset 10","Verset 11","Verset 12","Verset 13"],"r":3,"v":[["Romains 13",13],["Romains 13",12],["Romains 13",11],["Romains 13",10]],"x":"Conduisons-nous honnêtement, comme en plein jour, sans orgies ni ivrognerie, sans immoralité ni débauche, sans dispute ni jalousie."},{"id":"ciex0e","cat":"Quel verset ?","q":"Dans quel verset lit-on « … de se plaindre d’un autre, pardonnez-vous … » (Col 3) ?","o":["Verset 12","Verset 13","Verset 14","Verset 16"],"r":1,"v":[["Colossiens 3",13],["Colossiens 3",14],["Colossiens 3",16],["Colossiens 3",12]],"x":"Supportez-vous les uns les autres et, si l'un de vous a une raison de se plaindre d’un autre, pardonnez-vous réciproquement. Tout comme Christ vous a pardonné, pardonnez-vous aussi."},{"id":"g9zc1f","cat":"Quel verset ?","q":"Quel verset commence par « L'amour ne fait pas de mal… » (Rm 13) ?","o":["Verset 7","Verset 8","Verset 10","Verset 11"],"r":2,"v":[["Romains 13",10],["Romains 13",8],["Romains 13",7],["Romains 13",11]],"x":"L'amour ne fait pas de mal au prochain; l'amour est donc l'accomplissement de la loi."},{"id":"o0extx","cat":"Quel verset ?","q":"Dans quel verset lit-on « … Christ est assis à la droite … » (Col 3) ?","o":["Verset 1","Verset 2","Verset 3","Verset 4"],"r":0,"v":[["Colossiens 3",1],["Colossiens 3",2],["Colossiens 3",4],["Colossiens 3",3]],"x":"Si donc vous êtes ressuscités avec Christ, recherchez les choses d'en haut, où Christ est assis à la droite de Dieu."},{"id":"jydf61","cat":"Quel verset ?","q":"Dans quel verset lit-on « … ténèbres et revêtons les armes de … » (Rm 13) ?","o":["Verset 9","Verset 12","Verset 13","Verset 14"],"r":1,"v":[["Romains 13",12],["Romains 13",14],["Romains 13",13],["Romains 13",9]],"x":"La nuit est bien avancée, le jour approche. Débarrassons-nous donc des œuvres des ténèbres et revêtons les armes de la lumière."},{"id":"1v7ogm5","cat":"Quel verset ?","q":"Dans quel verset lit-on « … l'amour, qui est le lien de … » (Col 3) ?","o":["Verset 11","Verset 12","Verset 13","Verset 14"],"r":3,"v":[["Colossiens 3",14],["Colossiens 3",12],["Colossiens 3",13],["Colossiens 3",11]],"x":"Mais par-dessus tout cela, revêtez-vous de l'amour, qui est le lien de la perfection."},{"id":"14xl2w0","cat":"Quel verset ?","q":"Dans quel verset lit-on « … qui aime les autres a accompli … » (Rm 13) ?","o":["Verset 5","Verset 7","Verset 8","Verset 10"],"r":2,"v":[["Romains 13",8],["Romains 13",10],["Romains 13",7],["Romains 13",5]],"x":"Ne devez rien à personne, si ce n'est de vous aimer les uns les autres, car celui qui aime les autres a accompli la loi."},{"id":"hn742c","cat":"Quel verset ?","q":"Quel verset commence par « vous avez revêtu l'homme nouveau qui… » (Col 3) ?","o":["Verset 7","Verset 8","Verset 10","Verset 12"],"r":2,"v":[["Colossiens 3",10],["Colossiens 3",12],["Colossiens 3",8],["Colossiens 3",7]],"x":"vous avez revêtu l'homme nouveau qui se renouvelle pour parvenir à la vraie connaissance, conformément à l'image de celui qui l'a créé."},{"id":"ppc1iu","cat":"Quel verset ?","q":"Dans quel verset lit-on « … crainte. En effet, ce n'est pas … » (Rm 13) ?","o":["Verset 2","Verset 4","Verset 5","Verset 6"],"r":1,"v":[["Romains 13",4],["Romains 13",5],["Romains 13",2],["Romains 13",6]],"x":"car le magistrat est serviteur de Dieu pour ton bien. Mais si tu fais le mal, sois dans la crainte. En effet, ce n'est pas pour rien qu'il porte l'épée, puisqu'il est serviteur de Dieu pour manifester sa colère en punissant celui qui fait le mal."},{"id":"3ybv55","cat":"Quel verset ?","q":"Quel verset commence par « Attachez-vous aux réalités d'en haut, et… » (Col 3) ?","o":["Verset 1","Verset 2","Verset 4","Verset 5"],"r":1,"v":[["Colossiens 3",2],["Colossiens 3",4],["Colossiens 3",5],["Colossiens 3",1]],"x":"Attachez-vous aux réalités d'en haut, et non à celles qui sont sur la terre."},{"id":"1tth8wy","cat":"Quel verset ?","q":"Quel verset commence par « Il est donc nécessaire de se… » (Rm 13) ?","o":["Verset 2","Verset 5","Verset 7","Verset 8"],"r":1,"v":[["Romains 13",5],["Romains 13",8],["Romains 13",7],["Romains 13",2]],"x":"Il est donc nécessaire de se soumettre aux autorités, non seulement à cause de cette colère, mais encore par motif de conscience."},{"id":"1mkh9mr","cat":"Quel verset ?","q":"Quel verset commence par « Ne vous mentez pas les uns… » (Col 3) ?","o":["Verset 7","Verset 9","Verset 11","Verset 12"],"r":1,"v":[["Colossiens 3",9],["Colossiens 3",7],["Colossiens 3",11],["Colossiens 3",12]],"x":"Ne vous mentez pas les uns aux autres, car vous vous êtes dépouillés du vieil homme et de ses manières d’agir,"},{"id":"1r7jvjo","cat":"Quel verset ?","q":"Dans quel verset lit-on « … toute autorité vient de Dieu, et … » (Rm 13) ?","o":["Verset 1","Verset 2","Verset 3","Verset 4"],"r":0,"v":[["Romains 13",1],["Romains 13",3],["Romains 13",4],["Romains 13",2]],"x":"Que chacun se soumette aux autorités qui nous gouvernent, car toute autorité vient de Dieu, et celles qui existent ont été établies par Dieu."},{"id":"1i87c6i","cat":"Quel verset ?","q":"Dans quel verset lit-on « … former un seul corps, règne dans … » (Col 3) ?","o":["Verset 13","Verset 14","Verset 15","Verset 16"],"r":2,"v":[["Colossie 4",23]],"x":"v.2"},{"id":"1g1zr73","cat":"Quel verset ?","q":"Quel verset commence par « En effet, Christ est mort et… » ?","o":["Verset 6","Verset 7","Verset 9","Verset 11"],"r":2,"v":[["Romains 14",9],["Romains 14",11],["Romains 14",7],["Romains 14",6]],"x":"En effet, Christ est mort et [il est ressuscité,] il est revenu à la vie pour être le Seigneur des morts et des vivants."},{"id":"1oz4mei","cat":"Quel verset ?","q":"Dans quel verset lit-on « … les autres, mais veillez plutôt à … » ?","o":["Verset 12","Verset 13","Verset 15","Verset 16"],"r":1,"v":[["Romains 14",13],["Romains 14",16],["Romains 14",12],["Romains 14",15]],"x":"Ne nous jugeons donc plus les uns les autres, mais veillez plutôt à ne pas placer d’obstacle ou de piège devant votre frère."},{"id":"18mf077","cat":"Quel verset ?","q":"Quel verset commence par « Il est bien de ne pas… » ?","o":["Verset 19","Verset 20","Verset 21","Verset 22"],"r":2,"v":[["Romains 14",21],["Romains 14",19],["Romains 14",20],["Romains 14",22]],"x":"Il est bien de ne pas manger de viande, de ne pas boire de vin et de t'abstenir de ce qui peut être pour ton frère un obstacle, [un piège ou une source de faiblesse]."},{"id":"11eb2fo","cat":"Quel verset ?","q":"Quel verset commence par « Ainsi donc, chacun de nous rendra… » ?","o":["Verset 10","Verset 11","Verset 12","Verset 15"],"r":2,"v":[["Romains 14",12],["Romains 14",15],["Romains 14",10],["Romains 14",11]],"x":"Ainsi donc, chacun de nous rendra compte à Dieu pour lui-même."},{"id":"1scx51w","cat":"Quel verset ?","q":"Quel verset commence par « En effet, aucun de nous ne… » ?","o":["Verset 4","Verset 5","Verset 6","Verset 7"],"r":3,"v":[["Romains 14",7],["Romains 14",4],["Romains 14",6],["Romains 14",5]],"x":"En effet, aucun de nous ne vit pour lui-même et aucun ne meurt pour lui-même:"},{"id":"4cy3sv","cat":"Quel verset ?","q":"Quel verset commence par « L'un fait une différence entre les… » ?","o":["Verset 2","Verset 3","Verset 4","Verset 5"],"r":3,"v":[["Romains 14",5],["Romains 14",2],["Romains 14",4],["Romains 14",3]],"x":"L'un fait une différence entre les jours, un autre les estime tous égaux. Que chacun ait dans son esprit une pleine conviction."},{"id":"1eo1ldt","cat":"Quel verset ?","q":"Dans quel verset lit-on « … méprises-tu ton frère? Nous comparaîtrons tous … » ?","o":["Verset 9","Verset 10","Verset 11","Verset 13"],"r":1,"v":[["Romains 14",10],["Romains 14",11],["Romains 14",13],["Romains 14",9]],"x":"Mais toi, pourquoi juges-tu ton frère? Ou toi, pourquoi méprises-tu ton frère? Nous comparaîtrons tous, en effet, devant le tribunal de Christ,"},{"id":"1c3lzpw","cat":"Quel verset ?","q":"Dans quel verset lit-on « … considère telle chose comme impure, alors … » ?","o":["Verset 14","Verset 15","Verset 16","Verset 17"],"r":0,"v":[["Romains 14",14],["Romains 14",15],["Romains 14",17],["Romains 14",16]],"x":"Je sais et je suis convaincu dans le Seigneur Jésus que rien n'est impur en soi, mais si quelqu’un considère telle chose comme impure, alors elle est impure pour lui."},{"id":"1i95qbs","cat":"Quel verset ?","q":"Dans quel verset lit-on « … pour le Seigneur que nous mourons … » ?","o":["Verset 7","Verset 8","Verset 9","Verset 11"],"r":1,"v":[["Romains 14",8],["Romains 14",7],["Romains 14",11],["Romains 14",9]],"x":"si nous vivons, c'est pour le Seigneur que nous vivons, et si nous mourons, c'est pour le Seigneur que nous mourons. Ainsi, soit que nous vivions, soit que nous mourions, nous appartenons au Seigneur."},{"id":"58y30s","cat":"Quel verset ?","q":"Dans quel verset lit-on « … autre? Qu'il tienne bon ou qu'il … » ?","o":["Verset 1","Verset 4","Verset 6","Verset 7"],"r":1,"v":[["Romains 14",4],["Romains 14",6],["Romains 14",1],["Romains 14",7]],"x":"Qui es-tu pour juger le serviteur d'un autre? Qu'il tienne bon ou qu'il tombe, cela regarde son seigneur. Mais il tiendra bon, car Dieu a le pouvoir de l'affermir."},{"id":"116059d","cat":"Quel verset ?","q":"Quel verset commence par « Que ce qui est bon pour… » ?","o":["Verset 13","Verset 15","Verset 16","Verset 18"],"r":2,"v":[["Romains 14",16],["Romains 14",18],["Romains 14",15],["Romains 14",13]],"x":"Que ce qui est bon pour vous ne devienne pas un sujet de calomnie."},{"id":"96w6cv","cat":"Quel verset ?","q":"Dans quel verset lit-on « … l'amour. Ne cause pas, par ta … » ?","o":["Verset 15","Verset 16","Verset 17","Verset 18"],"r":0,"v":[["Romains 14",15],["Romains 14",16],["Romains 14",18],["Romains 14",17]],"x":"Si ton frère est attristé à cause de ce que tu manges, tu ne marches plus selon l'amour. Ne cause pas, par ta nourriture, la perte de celui pour lequel Christ est mort."},{"id":"1jan4qr","cat":"Quel verset ?","q":"Quel verset commence par « Ainsi donc, recherchons ce qui contribue… » ?","o":["Verset 16","Verset 17","Verset 19","Verset 22"],"r":2,"v":[["Romains 14",19],["Romains 14",17],["Romains 14",22],["Romains 14",16]],"x":"Ainsi donc, recherchons ce qui contribue à entretenir la paix et à nous faire grandir mutuellement dans la foi."},{"id":"58sv0g","cat":"Quel verset ?","q":"Quel verset commence par « Mais celui qui a des doutes… » ?","o":["Verset 20","Verset 21","Verset 22","Verset 23"],"r":3,"v":[["Romains 14",23],["Romains 14",21],["Romains 14",20],["Romains 14",22]],"x":"Mais celui qui a des doutes au sujet de ce qu'il mange est condamné, parce qu'il n'agit pas par une conviction de foi. Tout ce qui ne provient pas d’une conviction de foi est péché."},{"id":"qiz2y5","cat":"Quel verset ?","q":"Quel verset commence par « Accueillez celui qui est faible dans… » ?","o":["Verset 1","Verset 2","Verset 3","Verset 4"],"r":0,"v":[["Romains 14",1],["Romains 14",4],["Romains 14",3],["Romains 14",2]],"x":"Accueillez celui qui est faible dans la foi sans discuter ses opinions."},{"id":"1oevkds","cat":"Quel verset ?","q":"Quel verset commence par « Celui qui sert Christ de cette… » ?","o":["Verset 16","Verset 17","Verset 18","Verset 19"],"r":2,"v":[["Romains 14",18],["Romains 14",16],["Romains 14",19],["Romains 14",17]],"x":"Celui qui sert Christ de cette manière est agréable à Dieu et approuvé des hommes."},{"id":"x4sgnr","cat":"Quel verset ?","q":"Quel verset commence par « Cette foi que tu as, garde-la… » ?","o":["Verset 19","Verset 20","Verset 22","Verset 23"],"r":2,"v":[["Romains 14",22],["Romains 14",19],["Romains 14",23],["Romains 14",20]],"x":"Cette foi que tu as, garde-la pour toi devant Dieu. Heureux celui qui ne se condamne pas lui-même par ce qu'il approuve!"},{"id":"zrllcc","cat":"Quel verset ?","q":"Dans quel verset lit-on « … cette manière est agréable à Dieu … » ?","o":["Verset 15","Verset 17","Verset 18","Verset 20"],"r":2,"v":[["Romains 14",18],["Romains 14",15],["Romains 14",20],["Romains 14",17]],"x":"Celui qui sert Christ de cette manière est agréable à Dieu et approuvé des hommes."},{"id":"1hoqrdl","cat":"Quel verset ?","q":"Dans quel verset lit-on « … le Seigneur, chacun pliera le genou … » ?","o":["Verset 9","Verset 11","Verset 12","Verset 14"],"r":1,"v":[["Romains 14",11],["Romains 14",12],["Romains 14",9],["Romains 14",14]],"x":"car il est écrit: Je suis vivant, dit le Seigneur, chacun pliera le genou devant moi et toute langue rendra gloire à Dieu."},{"id":"2mfzg8","cat":"Quel verset ?","q":"Dans quel verset lit-on « … pas le manger et le boire … » ?","o":["Verset 14","Verset 15","Verset 17","Verset 18"],"r":2,"v":[["Romains 14",17],["Romains 14",18],["Romains 14",15],["Romains 14",14]],"x":"En effet, le royaume de Dieu, ce n'est pas le manger et le boire, mais la justice, la paix et la joie, par le Saint-Esprit."},{"id":"11kj30s","cat":"Quel verset ?","q":"Quel verset commence par « Celui qui fait une distinction entre… » ?","o":["Verset 4","Verset 5","Verset 6","Verset 8"],"r":2,"v":[["Romains 14",6],["Romains 14",8],["Romains 14",5],["Romains 14",4]],"x":"Celui qui fait une distinction entre les jours le fait pour le Seigneur [et celui qui ne fait pas de distinction le fait aussi pour le Seigneur]. Celui qui mange de tout, c’est pour le Seigneur qu’il le fait, puisqu’il exprime sa reconnaissance à Dieu. Celui qui ne mange pas de tout le fait aussi pour le Seigneur, et il est reconnaissant envers Dieu."},{"id":"mjh138","cat":"Quel verset ?","q":"Dans quel verset lit-on « … pour lui-même et aucun ne meurt … » ?","o":["Verset 4","Verset 6","Verset 7","Verset 9"],"r":2,"v":[["Romains 14",7],["Romains 14",4],["Romains 14",6],["Romains 14",9]],"x":"En effet, aucun de nous ne vit pour lui-même et aucun ne meurt pour lui-même:"},{"id":"1ttxfta","cat":"Quel verset ?","q":"Dans quel verset lit-on « … à entretenir la paix et à … » ?","o":["Verset 17","Verset 19","Verset 21","Verset 22"],"r":1,"v":[["Romains 14",19],["Romains 14",21],["Romains 14",22],["Romains 14",17]],"x":"Ainsi donc, recherchons ce qui contribue à entretenir la paix et à nous faire grandir mutuellement dans la foi."},{"id":"ni7stw","cat":"Quel verset ?","q":"Quel verset commence par « car il est écrit: Je suis… » ?","o":["Verset 8","Verset 9","Verset 11","Verset 12"],"r":2,"v":[["Romains 14",11],["Romains 14",12],["Romains 14",9],["Romains 14",8]],"x":"car il est écrit: Je suis vivant, dit le Seigneur, chacun pliera le genou devant moi et toute langue rendra gloire à Dieu."},{"id":"1srckp2","cat":"Quel verset ?","q":"Dans quel verset lit-on « … se condamne pas lui-même par ce … » ?","o":["Verset 19","Verset 20","Verset 21","Verset 22"],"r":3,"v":[["Romains 14",22],["Romains 14",21],["Romains 14",19],["Romains 14",20]],"x":"Cette foi que tu as, garde-la pour toi devant Dieu. Heureux celui qui ne se condamne pas lui-même par ce qu'il approuve!"},{"id":"gcpw1c","cat":"Quel verset ?","q":"Dans quel verset lit-on « … les estime tous égaux. Que chacun … » ?","o":["Verset 4","Verset 5","Verset 6","Verset 8"],"r":1,"v":[["Romains 14",5],["Romains 14",4],["Romains 14",6],["Romains 14",8]],"x":"L'un fait une différence entre les jours, un autre les estime tous égaux. Que chacun ait dans son esprit une pleine conviction."},{"id":"sl6zzl","cat":"Quel verset ?","q":"Quel  15",24],["Romains 15",25],["Romains 15",26],["Romains 15",27],["Romains 15",28],["Romains 15",29],["Romains 15",30],["Romains 15",31],["Romains 15",32],["Romains 15",33]],"x":"v.1"},{"id":"1qids5l","cat":"Quel verset ?","q":"Dans quel verset lit-on « … les non-Juifs ont eu part aux … » ?","o":["Verset 24","Verset 26","Verset 27","Verset 28"],"r":2,"v":[["Romains 15",27],["Romains 15",26],["Romains 15",24],["Romains 15",28]],"x":"Elles l'ont bien voulu et elles le leur devaient, car si les non-Juifs ont eu part aux avantages spirituels des Juifs, ils doivent aussi les assister dans leurs besoins matériels."},{"id":"17jeuuv","cat":"Quel verset ?","q":"Quel verset commence par « C'est aussi ce qui m'a souvent… » ?","o":["Verset 21","Verset 22","Verset 24","Verset 25"],"r":1,"v":[["Romains 15",22],["Romains 15",21],["Romains 15",24],["Romains 15",25]],"x":"C'est aussi ce qui m'a souvent empêché d'aller chez vous."},{"id":"1dfocb7","cat":"Quel verset ?","q":"Quel verset commence par « Que chacun de nous cherche à… » ?","o":["Verset 2","Verset 3","Verset 4","Verset 5"],"r":0,"v":[["Romains 15",2],["Romains 15",5],["Romains 15",4],["Romains 15",3]],"x":"Que chacun de nous cherche à plaire à son prochain pour son bien, en vue de le faire grandir dans la foi."},{"id":"1cm18yk","cat":"Quel verset ?","q":"Dans quel verset lit-on « … de l'Esprit de Dieu. Ainsi, depuis … » ?","o":["Verset 17","Verset 19","Verset 20","Verset 22"],"r":1,"v":[["Romains 15",19],["Romains 15",22],["Romains 15",20],["Romains 15",17]],"x":"par la puissance des signes et des prodiges et par la puissance de l'Esprit de Dieu. Ainsi, depuis Jérusalem et en rayonnant jusqu'en Illyrie, j'ai abondamment propagé l'Evangile de Christ."},{"id":"al4xhd","cat":"Quel verset ?","q":"Quel verset commence par « Ainsi je pourrai venir chez vous… » ?","o":["Verset 29","Verset 31","Verset 32","Verset 33"],"r":2,"v":[["Romains 15",32],["Romains 15",31],["Romains 15",29],["Romains 15",33]],"x":"Ainsi je pourrai venir chez vous dans la joie, si c'est la volonté de Dieu, et trouver un peu de repos au milieu de vous."},{"id":"1h1hgwc","cat":"Quel verset ?","q":"Dans quel verset lit-on « … certaine audace que je vous ai … » ?","o":["Verset 13","Verset 15","Verset 17","Verset 18"],"r":1,"v":[["Romains 15",15],["Romains 15",18],["Romains 15",13],["Romains 15",17]],"x":"Cependant, [frères et sœurs,] c’est avec une certaine audace que je vous ai écrit par endroits, comme pour réveiller vos souvenirs, et cela à cause de la grâce que Dieu m'a faite"},{"id":"1nxt69s","cat":"Quel verset ?","q":"Quel verset commence par « En ce qui vous concerne, mes… » ?","o":["Verset 11","Verset 12","Verset 13","Verset 14"],"r":3,"v":[["Romains 15",14],["Romains 15",12],["Romains 15",11],["Romains 15",13]],"x":"En ce qui vous concerne, mes frères et sœurs, je suis personnellement convaincu que vous êtes pleins de bonnes dispositions, remplis de toute connaissance et capables de vous avertir les uns les autres."},{"id":"1ypmskd","cat":"Quel verset ?","q":"Quel verset commence par « Or tout ce qui a été… » ?","o":["Verset 4","Verset 5","Verset 6","Verset 7"],"r":0,"v":[["Romains 15",4],["Romains 15",5],["Romains 15",7],["Romains 15",6]],"x":"Or tout ce qui a été écrit d'avance l'a été pour notre instruction afin que, par la persévérance et par le réconfort que donnent les Ecritures, nous possédions l'espérance."},{"id":"km6o8a","cat":"Quel verset ?","q":"Dans quel verset lit-on « … soient une offrande agréable, devenue sainte … » ?","o":["Verset 13","Verset 15","Verset 16","Verset 18"],"r":2,"v":[["Romains 15",16],["Romains 15",13],["Romains 15",15],["Romains 15",18]],"x":"d'être serviteur de Jésus-Christ pour les non-Juifs. Je m'acquitte ainsi du service sacré de la prédication de l'Evangile de Dieu afin que les non-Juifs soient une offrande agréable, devenue sainte par l’action de l'Esprit saint."},{"id":"1pcnekk","cat":"Quel verset ?","q":"Quel verset commence par « afin que tous ensemble, d'une seule… » ?","o":["Verset 3","Verset 4","Verset 6","Verset 9"],"r":2,"v":[["Romains 15",6],["Romains 15",9],["Romains 15",3],["Romains 15",4]],"x":"afin que tous ensemble, d'une seule voix, vous rendiez gloire au Dieu et Père de notre Seigneur Jésus-Christ."},{"id":"13luyfi","cat":"Quel verset ?","q":"Quel verset commence par « Je me suis fait un point… » ?","o":["Verset 19","Verset 20","Verset 22","Verset 23"],"r":1,"v":[["Romains 15",20],["Romains 15",22],["Romains 15",23],["Romains 15",19]],"x":"Je me suis fait un point d'honneur d'annoncer l'Evangile là où Christ n'avait pas été annoncé, afin de ne pas construire sur les fondations posées par un autre, mais comme il est écrit:"},{"id":"r9hevg","cat":"Quel verset ?","q":"Dans quel verset lit-on « … autres comme Christ vous a accueillis … » ?","o":["Verset 5","Verset 6","Verset 7","Verset 10"],"r":2,"v":[["Romains 15",7],["Romains 15",6],["Romains 15",5],["Romains 15",10]],"x":"Accueillez-vous donc les uns les autres comme Christ vous a accueillis, pour la gloire de Dieu."},{"id":"1obo5gi","cat":"Quel verset ?","q":"Dans quel verset lit-on « … bien voulu organiser une collecte en … » ?","o":["Verset 23","Verset 25","Verset 26","Verset 27"],"r":2,"v":[["Romains 15",26],["Romains 15",23],["Romains 15",25],["Romains 15",27]],"x":"En effet, les Eglises de la Macédoine et l'Achaïe ont bien voulu organiser une collecte en faveur de ceux qui sont pauvres parmi les saints de Jérusalem."},{"id":"1qu98lc","cat":"Quel verset ?","q":"Dans quel verset lit-on « … bénédiction de [l'Evangile de] Christ que … » ?","o":["Verset 26","Verset 27","Verset 29","Verset 31"],"r":2,"v":[["Romains 15",29],["Romains 15",31],["Romains 15",26],["Romains 15",27]],"x":"Je sais qu'en venant vous rendre visite, c'est avec une pleine bénédiction de [l'Evangile de] Christ que je le ferai."},{"id":"746plw","cat":"Quel verset ?","q":"Quel verset commence par « En effet, Christ n'a pas recherché… » ?","o":["Verset 2","Verset 3","Verset 4","Verset 5"],"r":1,"v":[["Romains 15",3],["Romains 15",5],["Romains 15",2],["Romains 15",4]],"x":"En effet, Christ n'a pas recherché ce qui lui plaisait, mais, comme il est écrit, les injures de ceux qui t'insultent sont tombées sur moi."},{"id":"1szn7ah","cat":"Quel verset ?","q":"Quel verset commence par « Esaïe dit aussi: Il paraîtra, le… » ?","o":["Verset 9","Verset 11","Verset 12","Verset 13"],"r":2,"v":[["Romains 15",12],["Romains 15",13],["Romains 15",9],["Romains 15",11]],"x":"Esaïe dit aussi: Il paraîtra, le rejeton d'Isaï, il se lèvera pour régner sur les nations; les nations espéreront en lui"},{"id":"xzjcpi","cat":"Quel verset ?","q":"Quel verset commence par « Que le Dieu de l'espérance vous… » ?","o":["Verset 12","Verset 13","Verset 15","Verset 16"],"r":1,"v":[["Romains 15",13],["Romains 15",16],["Romains 15",15],["Romains 15",12]],"x":"Que le Dieu de l'espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous débordiez d’espérance, par la puissance du Saint-Esprit!"},{"id":"19rfovr","cat":"Quel verset ?","q":"Quel verset commence par « Mais maintenant, comme je n'ai plus… » ?","o":["Verset 20","Verset 21","Verset 23","Verset 24"],"r":2,"v":[["Romains 15",23],["Romains 15",20],["Romains 15",21],["Romains 15",24]],"x":"Mais maintenant, comme je n'ai plus rien qui me retienne dans ces régions et que, depuis bien des années, j'ai le vif désir de vous rendre visite,"},{"id":"1wkwk7u","cat":"Quel verset ?","q":"Dans quel verset lit-on « … qui lui plaisait, mais, comme il … » ?","o":["Verset 1","Verset 2","Verset 3","Verset 5"],"r":2,"v":[["Romains 15",3],["Romains 15",5],["Romains 15",1],["Romains 15",2]],"x":"En effet, Christ n'a pas recherché ce qui lui plaisait, mais, comme il est écrit, les injures de ceux qui t'insultent sont tombées sur moi."},{"id":"1hb8w2e","cat":"Quel verset ?","q":"Dans quel verset lit-on « … de sa bonté, comme le dit … » ?","o":["Verset 6","Verset 9","Verset 10","Verset 11"],"r":1,"v":[["Romains 15",9],["Romains 15",10],["Romains 15",11],["Romains 15",6]],"x":"Quant aux non-Juifs, ils célèbrent Dieu à cause de sa bonté, comme le dit l’Ecriture: C'est pourquoi je te louerai parmi les nations et je chanterai à la gloire de ton nom."},{"id":"gweiqx","cat":"Quel verset ?","q":"Quel verset commence par « Dès que j'aurai réglé cette affaire… » ?","o":["Verset 26","Verset 27","Verset 28","Verset 31"],"r":2,"v":[["Romains 15",28],["Romains 15",31],["Romains 15",26],["Romains 15",27]],"x":"Dès que j'aurai réglé cette affaire et que je leur aurai remis ces dons, je partirai pour l'Espagne et je passerai chez vous."},{"id":"1jnhvyf","cat":"Quel verset ?","q":"Dans quel verset lit-on « … annoncé verront, et ceux qui n'en … » ?","o":["Verset 18","Verset 19","Verset 21","Verset 23"],"r":2,"v":[["Romains 15",21],["Romains 15",23],["Romains 15",19],["Romains 15",18]],"x":"Ceux à qui il n'avait pas été annoncé verront, et ceux qui n'en avaient pas entendu parler comprendront."},{"id":"ts105s","cat":"Quel verset ?","q":"Quel verset commence par « Ceux à qui il n'avait pas… » ?","o":["Verset 18","Verset 20","Verset 21","Verset 24"],"r":2,"v":[["Romains 15",21],["Romains 15",24],["Romains 15",18],["Romains 15",20]],"x":"Ceux à qui il n'avait pas été annoncé verront, et ceux qui n'en avaient pas entendu parler comprendront."},{"id":"yj02fu","cat":"Quel verset ?","q":"Dans quel verset lit-on « … j'ai le vif désir de vous … » ?","o":["Verset 21","Verset 23","Verset 24","Verset 26"],"r":1,"v":[["Romains 15",23],["Romains 15",24],["Romains 15",21],["Romains 15",26]],"x":"Mais maintenant, comme je n'ai plus rien qui me retienne dans ces régions et que, depuis bien des années, j'ai le vif désir de vous rendre visite,"},{"id":"1jzddj8","cat":"Quel verset ?","q":"Quel verset commence par « Accueillez-vous donc les uns les autres… » ?","o":["Verset 4","Verset 6","Verset 7","Verset 8"],"r":2,"v":[["Romains 15",7],["Romains 15",6],["Romains 15",4],["Romains 15",8]],"x":"Accueillez-vous donc les uns les autres comme Christ vous a accueillis, pour la gloire de Dieu."},{"id":"grugix","cat":"Quel verset ?","q":"Dans quel verset lit-on « … à son prochain pour son bien … » ?","o":["Verset 1","Verset 2","Verset 4","Verset 5"],"r":1,"v":[["Romains 15",2],["Romains 15",5],["Romains 15",4],["Romains 15",1]],"x":"Que chacun de nous cherche à plaire à son prochain pour son bien, en vue de le faire grandir dans la foi."},{"id":"3rvyfj","cat":"Quel verset ?","q":"Dans quel verset lit-on « … et sœurs, je suis personnellement convaincu … » ?","o":["Verset 11","Verset 12","Verset 14","Verset 17"],"r":2,"v":[["Romains 15",14],["Romains 15",11],["Romains 15",12],["Romains 15",17]],"x":"En ce qui vous concerne, mes frères et sœurs, je suis personnellement convaincu que vous êtes pleins de bonnes dispositions, remplis de toute connaissance et capables de vous avertir les uns les autres."},{"id":"1cbrzfa","cat":"Quel verset ?","q":"Dans quel verset lit-on « … le sont pas et de ne … » ?","o":["Verset 1","Verset 2","Verset 3","Verset 4"],"r":0,"v":[["Romains 15",1],["Romains 15",3],["Romains 15",4],["Romains 15",2]],"x":"Nous qui sommes forts, nous avons le devoir de supporter les faiblesses de ceux qui ne le sont pas et de ne pas rechercher ce qui nous plaît."},{"id":"zb6sqo","cat":"Quel verset ?","q":"Dans quel verset lit-on « … si Christ ne l’avait pas accompli … » ?","o":["Verset 17","Verset 18","Verset 20","Verset 21"],"r":1,"v":[["Romains 15",18],["Romains 15",20],["Romains 15",17],["Romains 15",21]],"x":"En effet, je n'oserais rien mentionner si Christ ne l’avait pas accompli par moi pour amener les non-Juifs à l'obéissance par la parole et par les actes,"},{"id":"jetg9p","cat":"Quel verset ?","q":"Quel verset commence par « Que le Dieu de la paix… » ?","o":["Verset 30","Verset 31","Verset 32","Verset 33"],"r":3,"v":[["Romains 15",33],["Romains 15",31],["Romains 15",30],["Romains 15",32]],"x":"Que le Dieu de la paix soit avec vous tous! Amen!"},{"id":"190vt8k","cat":"Comptage","q":"Combien de fois le m   const tag = R.isNew ? '<span class="dotc" style="background:#888"></span>nouvelle' : `<span class="dotc" style="background:${COL[R.done ? R.before : qStatus(q.id)]}"></span>${STNAME[R.done ? R.before : qStatus(q.id)]}`;
  const L = 'ABCD';
  const btns = R.order.map((oi, k) => { let cls = ''; if (R.done) { if (oi === q.r) cls = 'right'; else if (k === R.choice) cls = 'wrong'; }
    return `<button class="${cls}" data-act="qPick" data-k="${k}" ${R.done ? 'disabled' : ''}>${vf ? '' : `<span class="L">${L[k]}</span>`}<span>${esc(q.o[oi])}</span></button>`; }).join('');
  let fb = '';
  if (R.done) {
    const move = R.after !== R.before && R.before !== 'n' ? ` · passe en <b style="color:${COL[R.after]}">${STNAME[R.after]}</b>` : R.after === 'g' ? ' · <b style="color:#1f9d55">vert</b>' : ` · <b style="color:${COL[R.after]}">${STNAME[R.after]}</b>`;
    fb = `<div class="qz-x"><b style="color:${R.ok ? '#1f9d55' : '#d64545'}">${R.ok ? '✓ Juste' : '✗ Faux — réponse : ' + esc(q.o[q.r])}</b>${move}${q.x ? `<div class="hint" style="margin-top:6px;font-size:14px">${esc(q.x)}</div>` : ''}</div>
      <button class="primary" style="width:100%;margin-top:12px;min-height:54px;font-size:18px" data-act="qNext">Question suivante ▶</button>`;
  }
  return `<div class="qz-top"><button class="small" data-act="qQuit">✕</button><span class="grow"><b>${R.n}</b> répondues · <span style="color:#1f9d55">✓ ${R.okN}</span></span><span class="hint">${tag}</span></div>
  <div class="card"><div class="qz-chip">${esc(q.cat)}</div><div class="qz-q">${esc(q.q)}</div><div class="qz-grid ${vf ? 'vf' : ''}">${btns}</div>${fb}</div>`;
}
function tabsHTML() { return `<div class="tabs2"><button class="${tab === 'quiz' ? 'sel' : ''}" data-act="tab" data-v="quiz">🎯 Questions Quiz</button><button class="${tab === 'coeur' ? 'sel' : ''}" data-act="tab" data-v="coeur">📖 Entraînement par cœur</button></div>`; }
function chooserHTML() {
  return `<div class="home-hero"><h1>📖 Mon entraînement</h1><p class="muted">Choisis ton prénom (puis garde ce lien dans tes favoris) :</p></div>
  <div class="login">${JOUEURS.map(p => `<a href="?moi=${p}" style="text-decoration:none"><button style="width:100%;text-align:left">${esc(p)} <span class="muted" style="font-size:15px">· ${esc(TEXTE_DE[p].join(' + '))}</span></button></a>`).join('')}</div>`;
}
function render() {
  const app = $('#app');
  if (!ME) { app.innerHTML = chooserHTML(); return; }
  if (!ST.setup) view = 'prog';
  app.innerHTML = view === 'prog' ? progHTML() : view === 'trous' ? trousMenuHTML() : view === 'run' ? runHTML() : view === 'end' ? endHTML() : view === 'qrun' ? qrunHTML() : (tabsHTML() + (tab === 'quiz' ? quizHTML() : homeHTML()));
  tick();
  const f = app.querySelector('input.blank'); if (f && !('ontouchstart' in window)) f.focus();
}
function tick() {
  const now = Date.now();
  document.querySelectorAll('.cd[data-end]').forEach(el => {
    const left = Math.max(0, +el.dataset.end - now), tot = +el.dataset.total;
    el.querySelector('.cdbar i').style.width = (100 * left / tot) + '%';
    el.querySelector('.cdt').textContent = left > 0 ? (left / 1000).toFixed(1) + ' s' : 'Temps écoulé';
    el.classList.toggle('late', left < 3000);
  });
  if (view === 'run' && RUN && !RUN.L.done) {
    const it = RUN.items[RUN.i]; const sec = it && EX[it.kind].sec;
    if (sec && now > RUN.L.t0 + sec * 1000) {
      if (it.kind === 'mots' && (RUN.L.sel || []).length) timedAnswer(RUN.L.sel.slice());
      else finishItem(0, { expired: true });
    }
  }
}
setInterval(tick, 100);
function cnPickP(side, v) {
  const q = RUN.items[RUN.i].q; const L = RUN.L; const y = scrollY; const r = connectPick(q, L, side, v); render(); scrollTo(0, y);
  if (r === 'ok' || r === 'ko') { const f = L.fl; setTimeout(() => { if (RUN && RUN.L === L && L.fl === f && !L.done) { L.fl = {}; const y2 = scrollY; render(); scrollTo(0, y2); } }, 650); }
  if (r === 'done') setTimeout(() => { const y3 = scrollY; finishItem(q.vs.length / (q.vs.length + (L.err || 0)), { ms: Date.now() - L.t0 }); scrollTo(0, Math.min(y3, 0)); }, 500);
}
function timedAnswer(v) {
  const it = RUN.items[RUN.i], q = it.q, L = RUN.L; if (L.done) return;
  const ms = Math.min(EX[it.kind].sec * 1000, Date.now() - L.t0);
  let ok = false;
  if (it.kind === 'v2num') ok = v === q.t + '|' + q.n;
  else if (it.kind === 'premdern') ok = norm(v) === norm(q.ans);
  else if (it.kind === 'mots') ok = [...v].sort().join(',') === [...q.ans].sort().join(',');
  finishItem(ok ? 1 : 0, { pick: v, sel: Array.isArray(v) ? v : L.sel, ms });
}

const ACT = {
  noop() {},
  home() { view = 'home'; RUN = null; render(); scrollTo(0, 0); },
  tab(d) { tab = d.v; try { localStorage.setItem('qb_tab_' + ME, tab); } catch (e) {} view = 'home'; render(); },
  qStart() { QRUN = null; qNext(); },
  qPick(d) { qAnswer(+d.k); },
  qNext() { qNext(); },
  qQuit() { QRUN = null; view = 'home'; tab = 'quiz'; render(); scrollTo(0, 0); },
  qReset() { if (!confirm('Remettre toute ta progression du Quiz à zéro ?')) return; QZ = { st: {}, pos: 0, log: [], only: QZ.only }; saveQZ(); render(); },
  quit() { view = 'home'; RUN = null; render(); },
  prog() { view = 'prog'; render(); },
  saveProg() { tab = 'quiz';
    document.querySelectorAll('.pgin').forEach(i => { ST.prog[i.dataset.t] = Math.max(0, Math.min(TEXTES[i.dataset.t].length, parseInt(i.value, 10) || 0)); });
    if (!TEXTE_DE[ME].some(t => ST.prog[t] > 0)) { alert('Indique au moins 1 verset.'); return; }
    ST.setup = true; saveST(); view = 'home'; render();
  },
  start(ds) { startRun(ds.ex); },
  trousMenu() { view = 'trous'; render(); },
  pct(ds) { trousPct = +ds.v; render(); },
  startTrous() { startRun('trous', { pct: trousPct }); },
  again() { if (RUN.ex === 'trous') startRun('trous', { pct: trousPct }); else startRun(RUN.ex); },
  next() { nextItem(); },
  reveal() { RUN.L.rev = true; render(); },
  assess(ds) { finishItem(ds.v === '1' ? 1 : 0); },
  pickIni(ds) { const q = RUN.items[RUN.i].q; finishItem(ds.k === q.t + '|' + q.n ? 1 : 0, { pick: ds.k }); },
  pickNum(ds) { timedAnswer(ds.k); },
  pickOpt(ds) { timedAnswer(ds.o); },
  toggleNum(ds) { const s = RUN.L.sel || (RUN.L.sel = []); const i = s.indexOf(ds.k); if (i >= 0) s.splice(i, 1); else s.push(ds.k); render(); },
  sendMots() { if ((RUN.L.sel || []).length) timedAnswer(RUN.L.sel.slice()); },
  trousCheck() {
    const q = RUN.items[RUN.i].q; const ts = toks(V(q.t, q.n)); const vals = {};
    document.querySelectorAll('input.blank').forEach(i => vals[i.dataset.j] = i.value);
    const good = q.m.filter(j => norm(vals[j] || '') === norm(core(ts[j]))).length;
    finishItem(good / q.m.length, { vals, good });
  },
  ordTap(ds) { const o = RUN.L.order || (RUN.L.order = []); const k = +ds.k; const i = o.indexOf(k); if (i >= 0) o.splice(i); else o.push(k); render(); },
  ordReset() { RUN.L.order = []; render(); },
  cnV(ds) { cnPickP('v', ds.v); }, cnN(ds) { cnPickP('n', ds.v); },
  ordCheck() { const q = RUN.items[RUN.i].q; const ch = RUN.L.order.map(k => q.sh[k]); const good = ch.filter((n, i) => n === q.seq[i]).length; finishItem(good / q.seq.length, { good }); },
  errTap(ds) { RUN.L.pick = +ds.j; render(); },
  errCheck() { const q = RUN.items[RUN.i].q; if (RUN.L.pick == null) return; finishItem(RUN.L.pick >= q.a && RUN.L.pick <= q.b ? 1 : 0); },
  showV(ds) { const x = unkey(ds.k); $('#vshow').innerHTML = `<div class="miss"><b>${esc(x.t)} v${x.n}</b><div class="verse" style="margin:4px 0 0;font-size:17px">${esc(V(x.t, x.n))}</div></div>`; },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('blank') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextBlank(e.target, e.key === 'Enter'); }
});
document.addEventListener('change', e => { if (e.target.id === 'qonly') { QZ.only = e.target.checked; saveQZ(); render(); } });
document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('blank') && /\s/.test(e.target.value)) { e.target.value = e.target.value.replace(/\s+/g, ''); nextBlank(e.target, false); }
});
function nextBlank(el, enter) { const all = [...document.querySelectorAll('input.blank')]; const i = all.indexOf(el); if (i < all.length - 1) all[i + 1].focus(); else if (enter) ACT.trousCheck(); }

if (ME) { loadST(); loadQZ(); tab = 'quiz'; document.title = 'Entraînement de ' + ME; }
render();
</script>
</body>
</html>
