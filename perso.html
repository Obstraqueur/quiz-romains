<style>

*{box-sizing:border-box}

.muted{color:var(--muted)}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}

.hand button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.login{display:grid;gap:10px;margin-top:20px}

details summary{cursor:pointer;font-weight:600;padding:6px 0}

.banner{background:var(--warn);color:#1f1d1a;padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.admin-ans{border-left:4px solid var(--accent);padding:8px 12px;background:var(--soft);border-radius:8px;margin:8px 0}
.hint{font-size:13px;color:var(--muted)}
body.table{font-size:20px}

body.table .huge{font-size:64px}

.fav{border-left:4px solid var(--accent);padding-left:10px}
.qcard{font-size:22px;font-weight:600}
</style>

const EN_LIGNE = [], ANIMATEUR = '', SALLE = 'perso', BROKERS = [];
const TEXTES = {"Romains 2": ["Qui que tu sois, homme, toi qui juges, tu es donc inexcusable. En effet, en jugeant les autres tu te condamnes toi-même, puisque toi qui juges tu agis comme eux.", "Nous savons que le jugement de Dieu contre ceux qui agissent ainsi est conforme à la vérité.", "Et penses-tu, toi qui juges les auteurs de tels actes et qui les fais aussi, que tu échapperas au jugement de Dieu?", "Ou méprises-tu les richesses de sa bonté, de sa patience et de sa générosité en ne reconnaissant pas que la bonté de Dieu te pousse à changer d’attitude?", "Par ton endurcissement et ton refus de te repentir, tu t'amasses un trésor de colère pour le jour où Dieu révélera sa colère et son juste jugement.", "Il traitera chacun conformément à ses actes :", "à ceux qui, par leur persévérance à faire le bien, recherchent l'honneur, la gloire et l'incorruptibilité, il donnera la vie éternelle;", "mais il réserve son indignation et sa colère à ceux qui, par esprit de révolte, rejettent la vérité et obéissent à l'injustice.", "La détresse et l’angoisse atteindront tout être humain qui fait le mal, le Juif d’abord, mais aussi le non-Juif.", "La gloire, l’honneur et la paix seront pour tout homme qui fait le bien, le Juif d’abord, mais aussi le non-Juif,", "car devant Dieu il n'y a pas de favoritisme.", "Tous ceux qui ont péché sans la loi périront aussi sans la loi, et tous ceux qui ont péché sous la loi seront jugés au moyen de la loi.", "En effet, ce ne sont pas ceux qui écoutent la loi qui sont justes devant Dieu, mais ce sont ceux qui la mettent en pratique qui seront déclarés justes.", "Quand des non-Juifs qui n'ont pas la loi font naturellement ce que prescrit la loi, ils se tiennent lieu de loi à eux-mêmes, bien qu'ils n'aient pas la loi.", "Ils montrent que l'œuvre de la loi est écrite dans leur cœur, car leur conscience en rend témoignage et leurs pensées les accusent ou les défendent tour à tour.", "C'est ce qui paraîtra le jour où, conformément à l’Evangile que je prêche, Dieu jugera par Jésus-Christ le comportement secret des hommes.", "Toi qui te donnes le nom de Juif, tu te reposes sur la loi, tu places ta fierté dans ton Dieu,", "tu connais sa volonté et tu discernes ce qui est important, car tu es instruit par la loi.", "Tu es convaincu d'être le conducteur des aveugles, la lumière de ceux qui sont dans les ténèbres,", "l'éducateur des ignorants, le maître des enfants parce que tu possèdes dans la loi l'expression de la connaissance et de la vérité.", "Toi donc qui enseignes les autres, tu ne t'enseignes pas toi-même! Toi qui prêches de ne pas voler, tu voles!", "Toi qui dis de ne pas commettre d'adultère, tu commets l'adultère! Toi qui as les idoles en horreur, tu pilles les temples!", "Toi qui places ta fierté dans la loi, tu déshonores Dieu en la transgressant!", "En effet, le nom de Dieu est blasphémé parmi les nations à cause de vous, comme cela est écrit.", "Certes, la circoncision est utile si tu mets en pratique la loi; mais si tu la violes, ta circoncision devient incirconcision.", "Si donc l'incirconcis respecte les commandements de la loi, son incirconcision ne sera-t-elle pas comptée comme circoncision?", "Ainsi, l'homme qui accomplit la loi sans être circoncis physiquement ne te condamnera-t-il pas, toi qui la transgresses tout en ayant la loi écrite et la circoncision?", "Le Juif, ce n'est pas celui qui en a l’apparence, et la circoncision, ce n'est pas celle qui est visible dans le corps.", "Mais le Juif, c'est celui qui l'est intérieurement, et la circoncision, c'est celle du cœur, accomplie par l'Esprit et non par la loi écrite. La louange que reçoit ce Juif ne vient pas des hommes, mais de Dieu."], "Romains 12": ["Je vous encourage donc, frères et sœurs, par les compassions de Dieu, à offrir votre corps comme un sacrifice vivant, saint, agréable à Dieu. Ce sera de votre part un culte raisonnable.", "Ne vous conformez pas au monde actuel, mais soyez transformés par le renouvellement de l’intelligence afin de discerner quelle est la volonté de Dieu, ce qui est bon, agréable et parfait.", "Par la grâce qui m'a été donnée, je dis à chacun de vous de ne pas avoir une trop haute opinion de lui-même, mais de garder des sentiments modestes, chacun selon la mesure de foi que Dieu lui a donnée.", "En effet, de même que nous avons plusieurs membres dans un seul corps et que tous les membres n'ont pas la même fonction,", "de même, nous qui sommes plusieurs, nous formons un seul corps en Christ et nous sommes tous membres les uns des autres, chacun pour sa part.", "Nous avons des dons différents, selon la grâce qui nous a été accordée. Si quelqu’un a le don de prophétie, qu'il l'exerce en accord avec la foi;", "si un autre est appelé à servir, qu'il se consacre à son service. Que celui qui enseigne se donne à son enseignement,", "et celui qui a le don d’encourager à l'encouragement. Que celui qui donne le fasse avec générosité, celui qui préside, avec zèle, et que celui qui exerce la bienveillance le fasse avec joie.", "Que l'amour soit sans hypocrisie. Ayez le mal en horreur, attachez-vous au bien.", "Par amour fraternel soyez pleins d'affection les uns pour les autres et rivalisez d'estime réciproque.", "Ayez du zèle, et non de la paresse. Soyez fervents d'esprit et servez le Seigneur.", "Réjouissez-vous dans l'espérance et soyez patients dans la détresse. Persévérez dans la prière.", "Pourvoyez aux besoins des saints et exercez l'hospitalité avec empressement.", "Bénissez ceux qui vous persécutent, bénissez et ne maudissez pas.", "Réjouissez-vous avec ceux qui se réjouissent, pleurez avec ceux qui pleurent.", "Vivez en plein accord les uns avec les autres. N'aspirez pas à ce qui est élevé, mais laissez-vous attirer par ce qui est humble. Ne vous prenez pas pour des sages.", "Ne rendez à personne le mal pour le mal. Recherchez ce qui est bien devant tous les hommes.", "Si cela est possible, dans la mesure où cela dépend de vous, soyez en paix avec tous les hommes.", "Ne const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’`´]/g, "'").replace(/[\[\]]/g, '').trim();
const toks = t => t.split(/\s+/).filter(Boolean);
const core = tok => tok.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
function splitTok(tok) { const m = tok.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u); return { pre: m[1], core: m[2], post: m[3] }; }
const rnd = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const V = (t, n) => TEXTES[t][n - 1];

const normA = s => String(s ?? '').toLowerCase().replace(/[’`´]/g, "'").replace(/[\[\]]/g, '').trim();
function motsInfo(t, n) {
  const out = [];
  for (const tok of toks(V(t, n))) {
    const { core: c, post } = splitTok(tok); if (!c) { if (out.length && /[.?!:;]/.test(tok)) out[out.length - 1].brk = true; continue; }

function poolOf(p, cfg = S.config) {
  const out = [];
  for (const t of TEXTE_DE[p] || []) {
    const k = Math.max(0, Math.min(+((cfg.progression[p] || {})[t]) || 0, TEXTES[t].length));
    for (let n = 1; n <= k; n++) out.push({ t, n });
  }
  return out;
}

function pickFrom(p, used, filt) {
  let pl = poolOf(p); if (filt) pl = pl.filter(filt);
  if (!pl.length) return null;
  let fr = pl.filter(v => !used.includes(vkey(v)));
  if (!fr.length) { for (const v of pl) { const i = used.indexOf(vkey(v)); if (i >= 0) used.splice(i, 1); } fr = pl; }
  const v = rnd(fr); used.push(vkey(v)); return v;
}
function firstLast(t, n, w) { const c = toks(V(t, n)).map(core).filter(Boolean); return w === 'premier' ? c[0] : c[c.length - 1]; }

const GEN = {
  num2verse(p, u) { const v = pickFrom(p, u); return v && { k: 'num2verse', t: v.t, n: v.n }; },
  initiales(p, u) { const v = pickFrom(p, u); return v && { k: 'initiales', t: v.t, n: v.n }; },
  suivant(p, u) {
    const pl = poolOf(p); const has = (t, n) => pl.some(x => x.t === t && x.n === n);
    const v = pickFrom(p, u, x => has(x.t, x.n + 1) || has(x.t, x.n - 1)); if (!v) return null;
    const d = rnd([1, -1].filter(d => has(v.t, v.n + d)));
    return { k: 'suivant', t: v.t, n: v.n, d };

  v2num(p, u) { const v = pickFrom(p, u); return v && { k: 'v2num', t: v.t, n: v.n, g: gridOf(p) }; },
  premdern(p, u) {
    const v = pickFrom(p, u); if (!v) return null;
    const w = Math.random() < .5 ? 'premier' : 'dernier';
    const ans = firstLast(v.t, v.n, w); const opts = [ans]; const seen = new Set([norm(ans)]);
    const add = o => { if (o && !seen.has(norm(o)) && opts.length < 4) { seen.add(norm(o)); opts.push(o); } };
    for (const x of shuffle(poolOf(p))) add(firstLast(x.t, x.n, w));
    for (const t of TEXTE_DE[p]) for (const n of shuffle(TEXTES[t].map((_, i) => i + 1))) add(firstLast(t, n, w));

    for (let tries = 0; tries < 120; tries++) {
      const v = rnd(pl); const ws = motsInfo(v.t, v.n);
      const L = rnd([1, 1, 2, 2, 3]); if (ws.length < L) continue;
      const i = Math.floor(Math.random() * (ws.length - L + 1));
      const sl = ws.slice(i, i + L); if (sl.slice(0, -1).some(x => x.brk)) continue;

const ACT = {
  noop() {},
  home() { view = 'home'; RUN = null; render(); scrollTo(0, 0); },
  quit() { view = 'home'; RUN = null; render(); },
  prog() { view = 'prog'; render(); },
  saveProg() {
    document.querySelectorAll('.pgin').forEach(i => { ST.prog[i.dataset.t] = Math.max(0, Math.min(TEXTES[i.dataset.t].length, parseInt(i.value, 10) || 0)); });
    if (!TEXTE_DE[ME].some(t => ST.prog[t] > 0)) { alert('Indique au moins 1 verset.'); return; }
    ST.setup = true; saveST(); view = 'home'; render();
  },
  start(ds) { startRun(ds.ex); },
  trousMenu() { view = 'trous'; render(); },
  pct(ds) { trousPct = +ds.v; render(); },
  startTrous() { startRun('trous', { pct: trousPct }); },
  again() { if (RUN.ex === 'trous') startRun('trous', { pct: trousPct }); else startRun(RUN.ex); },
  next() { nextItem(); },
  reveal() { RUN.L.rev = true; render(); },
  assess(ds) { finishItem(ds.v === '1' ? 1 : 0); },
  pickIni(ds) { const q = RUN.items[RUN.i].q; finishItem(ds.k === q.t + '|' + q.n ? 1 : 0, { pick: ds.k }); },
  pickNum(ds) { timedAnswer(ds.k); },
  pickOpt(ds) { timedAnswer(ds.o); },
  toggleNum(ds) { const s = RUN.L.sel || (RUN.L.sel = []); const i = s.indexOf(ds.k); if (i >= 0) s.splice(i, 1); else s.push(ds.k); render(); },
  sendMots() { if ((RUN.L.sel || []).length) timedAnswer(RUN.L.sel.slice()); },
  trousCheck() {
    const q = RUN.items[RUN.i].q; const ts = toks(V(q.t, q.n)); const vals = {};
    document.querySelectorAll('input.blank').forEach(i => vals[i.dataset.j] = i.value);
    const good = q.m.filter(j => norm(vals[j] || '') === norm(core(ts[j]))).length;
    finishItem(good / q.m.length, { vals, good });
  },
  ordTap(ds) { const o = RUN.L.order || (RUN.L.order = []); const k = +ds.k; const i = o.indexOf(k); if (i >= 0) o.splice(i); else o.push(k); render(); },
  ordReset() { RUN.L.order = []; render(); },
  ordCheck() { const q = RUN.items[RUN.i].q; const ch = RUN.L.order.map(k => q.sh[k]); const good = ch.filter((n, i) => n === q.seq[i]).length; finishItem(good / q.seq.length, { good }); },
  errTap(ds) { RUN.L.pick = +ds.j; render(); },
  errCheck() { const q = RUN.items[RUN.i].q; if (RUN.L.pick == null) return; finishItem(RUN.L.pick >= q.a && RUN.L.pick <= q.b ? 1 : 0); },
  showV(ds) { const x = unkey(ds.k); $('#vshow').innerHTML = `<div class="miss"><b>${esc(x.t)} v${x.n}</b><div class="verse" style="margin:4px 0 0;font-size:17px">${esc(V(x.t, x.n))}</div></div>`; },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('blank') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextBlank(e.target, e.key === 'Enter'); }
});
document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('blank') && /\s/.test(e.target.value)) { e.target.value = e.target.value.replace(/\s+/g, ''); nextBlank(e.target, false); }
});
function nextBlank(el, enter) { const all = [...document.querySelectorAll('input.blank')]; const i = all.indexOf(el); if (i < all.length - 1) all[i + 1].focus(); else if (enter) ACT.trousCheck(); }

if (ME) { loadST(); document.title = 'Entraînement de ' + ME; }
render();
</script>
</body>
</html>
