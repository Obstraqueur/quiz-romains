<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salves Quiz biblique</title>
<style>
:root{
  --bg:#f5f3ef; --card:#fff; --ink:#1d1b18; --muted:#6d685f; --line:#e3ddd2; --soft:#efeae1;
  --accent:#3f5bd8; --accent-ink:#fff; --good:#1e9a52; --good-soft:#dcf3e5; --bad:#d4483f; --bad-soft:#fbe3e1; --warn:#c88a00; --warn-soft:#fff1cc;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141418; --card:#1f1f26; --ink:#f0ede7; --muted:#a19c93; --line:#33323b; --soft:#2a2932;
  --accent:#8a9cff; --accent-ink:#11131c; --good:#41cc7c; --good-soft:#173826; --bad:#ff6f66; --bad-soft:#3d1c1a; --warn:#f0b429; --warn-soft:#3a2e0d; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141418; --card:#1f1f26; --ink:#f0ede7; --muted:#a19c93; --line:#33323b; --soft:#2a2932;
  --accent:#8a9cff; --accent-ink:#11131c; --good:#41cc7c; --good-soft:#173826; --bad:#ff6f66; --bad-soft:#3d1c1a; --warn:#f0b429; --warn-soft:#3a2e0d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 40px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px}
button:active{transform:translateY(1px)} button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
button.good{background:var(--good);color:#fff;border-color:var(--good);font-weight:700}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:700}
button.warn{background:var(--warn);color:#1d1b18;border-color:var(--warn);font-weight:700}
button.small{min-height:34px;padding:5px 10px;font-size:14px;border-radius:9px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:10px 16px;display:flex;gap:10px;align-items:center}
.hdr h1{font-size:17px;margin:0;flex:1;line-height:1.2;min-width:0}
.hdr h1 small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}.dot.on{background:var(--good)}
.hdr a{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
h2{font-size:20px;margin:0 0 8px;text-wrap:balance} h3{font-size:15px;margin:14px 0 6px}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.sec{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:6px}
.qtxt{font-size:21px;font-weight:650;line-height:1.35;margin:4px 0 10px;text-wrap:pretty}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.opt b{flex:none;width:22px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.ans{border-radius:12px;padding:12px;background:var(--good-soft);margin-top:10px}
.ans .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--good)}
.verse{font-size:17px;line-height:1.55;margin:4px 0}
.note{font-size:14px;color:var(--muted);margin-top:6px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ctrls .full{grid-column:1/-1}
.ctrls button{min-height:56px;font-size:18px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:650}
.banner.warn{background:var(--warn-soft)} .banner.ok{background:var(--good-soft);color:var(--good)} .banner.ko{background:var(--bad-soft);color:var(--bad)}
.listen{text-align:center;padding:30px 10px}
.listen .ico{font-size:48px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;padding:4px 12px;border-radius:999px;background:var(--soft)}
.timer.late{background:var(--bad);color:#fff}
.pbar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 12px}.pbar i{display:block;height:100%;background:var(--accent)}
.grid5{display:grid;gap:8px}
.ycard{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px}
.ycard .nm{font-weight:700;font-size:17px}
.ycard .info{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.ycard.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.login{display:grid;gap:8px}
.login button{text-align:left;font-size:18px;min-height:54px}
.lgrp{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:18px 0 6px}
.hist{display:grid;gap:8px}
.hitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.hitem .h{display:flex;gap:8px;align-items:baseline}
.hitem .h b{flex:1;font-weight:600}
.okc{color:var(--good);font-weight:800}.koc{color:var(--bad);font-weight:800}.skc{color:var(--muted);font-weight:800}
.score{display:flex;gap:14px;font-weight:700}
.prog{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.prog input{width:72px}
.switch{display:flex;gap:10px;align-items:center;font-weight:600}
.switch input{width:22px;height:22px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vline{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.5}
.vline .vn{flex:none;width:28px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.vline.todo{opacity:.55}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.qline{border-top:1px solid var(--line);padding:8px 0}
.qline .qa{color:var(--good);font-weight:600;font-size:14px}
.qline .qo{font-size:13px;color:var(--muted)}
.sech{margin:16px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:800}
.rot{width:100%;border-collapse:collapse;font-size:14px}.rot td{padding:5px 4px;border-top:1px solid var(--line)}
.rot tr.me td{font-weight:700;color:var(--accent)}
details summary{cursor:pointer;font-weight:650;padding:4px 0}
@media (max-width:480px){.qtxt{font-size:19px}.ctrls button{font-size:16px}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

const TEXTES = {"Romains 2": ["Qui que tu sois, homme, toi qui juges, tu es donc inexcusable. En effet, en jugeant les autres tu te condamnes toi-même, puisque toi qui juges tu agis comme eux.", "Nous savons que le jugement de Dieu contre ceux qui agissent ainsi est conforme à la vérité.", "Et penses-tu, toi qui juges les auteurs de tels actes et qui les fais aussi, que tu échapperas au jugement de Dieu?", "Ou méprises-tu les richesses de sa bonté, de sa patience et de sa générosité en ne reconnaissant pas que la bonté de Dieu te pousse à changer d’attitude?", "Par ton endurcissement et ton refus de te repentir, tu t'amasses un trésor de colère pour le jour où Dieu révélera sa colère et son juste jugement.", "Il traitera chacun conformément à ses actes :", "à ceux qui, par leur persévérance à faire le bien, recherchent l'honneur, la gloire et l'incorruptibilité, il donnera la vie éternelle;", "mais il réserve son indignation et sa colère à ceux qui, par esprit de révolte, rejettent la vérité et obéissent à l'injustice.", "La détresse et l’angoisse atteindront tout être humain qui fait le mal, le Juif d’abord, mais aussi le non-Juif.", "La gloire, l’honneur et la paix seront pour tout homme qui fait le bien, le Juif d’abord, mais aussi le non-Juif,", "car devant Dieu il n'y a pas de favoritisme.", "Tous ceux qui ont péché sans la loi périront aussi sans la loi, et tous ceux qui ont péché sous la loi seront jugés au moyen de la loi.", "En effet, ce ne sont pas ceux qui écoutent la loi qui sont justes devant Dieu, mais ce sont ceux qui la mettent en pratique qui seront déclarés justes.", "Quand des non-Juifs qui n'ont pas la loi font naturellement ce que prescrit la loi, ils se tiennent lieu de loi à eux-mêmes, bien qu'ils n'aient pas la loi.", "Ils montrent que l'œuvre de la loi est écrite dans leur cœur, car leur conscience en rend témoignage et leurs pensées les accusent ou les défendent tour à tour.", "C'est ce qui paraîtra le jour où, conformément à l’Evangile que je prêche, Dieu jugera par Jésus-Christ le comportement secret des hommes.", "Toi qui te donnes le nom de Juif, tu te reposes sur la loi, tu places ta fierté dans ton Dieu,", "tu connais sa volonté et tu discernes ce qui est important, car tu es instruit par la loi.", "Tu es convaincu d'être le conducteur des aveugles, la lumière de ceux qui sont dans les ténèbres,", "l'éducateur des ignorants, le maître des enfants parce que tu possèdes dans la loi l'expression de la connaissance et de la vérité.", "Toi donc qui enseignes les autres, tu ne t'enseignes pas toi-même! Toi qui prêches de ne pas voler, tu voles!", "Toi qui dis de ne pas commettre d'adultère, tu commets l'adultère! Toi qui as les idoles en horreur, tu pilles les temples!", "Toi qui places ta fierté dans la loi, tu déshonores Dieu en la transgressant!", "En effet, le nom de Dieu est blasphémé parmi les nations à cause de vous, comme cela est écrit.", "Certes, la circoncision est utile si tu mets en pratique la loi; mais si tu la violes, ta circoncision devient incirconcision.", "Si donc l'incirconcis respecte les commandements de la loi, son incirconcision ne sera-t-elle pas comptée comme circoncision?", "Ainsi, l'homme qui accomplit la loi sans être circoncis physiquement ne te condamnera-t-il pas, toi qui la transgresses tout en ayant la loi écrite et la circoncision?", "Le Juif, ce n'est pas celui qui en a l’apparence, et la circoncision, ce n'est pas celle qui est visible dans le corps.", "Mais le Juif, c'est celui qui l'est intérieurement, et la circoncision, c'est celle du cœur, accomplie par l'Esprit et non par la loi écrite. La louange que reçoit ce Juif ne vient pas des hommes, mais de Dieu."], "Romains 12": ["Je vous encourage donc, frères et sœurs, par les compassions de Dieu, à offrir votre corps comme un sacrifice vivant, saint, agréable à Dieu. Ce sera de votre part un culte raisonnable.", "Ne vous conformez pas au monde actuel, mais soyez transformés par le renouvellement de l’intelligence afin de discerner quelle est la volonté de Dieu, ce qui est bon, agréable et parfait.", "Par la grâce qui m'a été donnée, je dis à chacun de vous de ne pas avoir une trop haute opinion de lui-même, mais de garder des sentiments modestes, chacun selon la mesure de foi que Dieu lui a donnée.", "En effet, de même que nous avons plusieurs membres dans un seul corps et que tous les membres n'ont pas la même fonction,", "de même, nous qui sommes plusieurs, nous formons un seul corps en Christ et nous sommes tous membres les uns des autres, chacun pour sa part.", "Nous avons des dons différents, selon la grâce qui nous a été accordée. Si quelqu’un a le don de prophétie, qu'il l'exerce en accord avec la foi;", "si un autre est appelé à servir, qu'il se consacre à son service. Que celui qui enseigne se donne à son enseignement,", "et celui qui a le don d’encourager à l'encouragement. Que celui qui donne le fasse avec générosité, celui qui préside, avec zèle, et que celui qui exerce la bienveillance le fasse avec joie.", "Que l'amour soit sans hypocrisie. Ayez le mal en horreur, attachez-vous au bien.", "Par amour fraternel soyez pleins d'affection les uns pour les autres et rivalisez d'estime réciproque.", "Ayez du zèle, et non de la paresse. Soyez fervents d'esprit et servez le Seigneur.", "Réjouissez-vous dans l'espérance et soyez patients dans la détresse. Persévérez dans la prière.", "Pourvoyez aux besoins des saints et exercez l'hospitalité avec empressement.", "Bénissez ceux qui vous persécutent, bénissez et ne maudissez pas.", "Réjouissez-vous avec ceux qui se réjouissent, pleurez avec ceux qui pleurent.", "Vivez en plein accord les uns avec les autres. N'aspirez pas à ce qui est élevé, mais laissez-vous attirer par ce qui est humble. Ne vous prenez pas pour des sages.", "Ne rendez à personne le mal pour le mal. Recherchez ce qui est bien devant tous les hommes.", "Si cela est possible, dans la mesure où cela dépend de vous, soyez en paix avec tous les hommes.", "Ne vous vengez pas vous-mêmes, bien-aimés, mais laissez agir la colère de Dieu, car il est écrit: C’est à moi qu’appartient la vengeance, c’est moi qui donnerai à chacun ce qu’il mérite, dit le Seigneur.", "Mais si ton ennemi a faim, donne-lui à manger, s'il a soif, donne-lui à boire, car en agissant ainsi, tu amasseras des charbons ardents sur sa tête.", "Ne te laisse pas vaincre par le mal, mais sois vainqueur du mal par le bien."], "Romains 13": ["Que chacun se soumette aux autorités qui nous gouvernent, car toute autorité vient de Dieu, et celles qui existent ont été établies par Dieu.", "C'est pourquoi celui qui s'oppose à l'autorité résiste à l'ordre que Dieu a établi, et ceux qui résistent attireront une condamnation sur eux-mêmes.", "En effet, on n’a pas à craindre les magistrats quand on fait le bien, mais quand on fait le mal. Veux-tu ne pas avoir à craindre l'autorité? Fais le bien et tu auras son approbation,", "car le magistrat est serviteur de Dieu pour ton bien. Mais si tu fais le mal, sois dans la crainte. En effet, ce n'est pas pour rien qu'il porte l'épée, puisqu'il est serviteur de Dieu pour manifester sa colère en punissant celui qui fait le mal.", "Il est donc nécessaire de se soumettre aux autorités, non seulement à cause de cette colère, mais encore par motif de conscience.", "C'est aussi pour cela que vous payez des impôts, car les magistrats sont des serviteurs de Dieu qui s'appliquent entièrement à cette fonction.", "Rendez à chacun ce qui lui est dû: l'impôt à qui vous devez l'impôt, la taxe à qui vous devez la taxe, le respect à qui vous devez le respect, l'honneur à qui vous devez l'honneur.", "Ne devez rien à personne, si ce n'est de vous aimer les uns les autres, car celui qui aime les autres a accompli la loi.", "En effet, les commandements: Tu ne commettras pas d'adultère, tu ne commettras pas de meurtre, tu ne commettras pas de vol, tu ne porteras pas de faux témoignage, tu ne convoiteras pas, ainsi que tous les autres, se résument dans cette parole: Tu aimeras ton prochain comme toi-même.", "L'amour ne fait pas de mal au prochain; l'amour est donc l'accomplissement de la loi.", "Cela est d'autant plus important que vous savez quel temps nous vivons: c'est l'heure de vous réveiller enfin du sommeil, car maintenant le salut est plus près de nous qu’au moment où nous avons cru.", "La nuit est bien avancée, le jour approche. Débarrassons-nous donc des œuvres des ténèbres et revêtons les armes de la lumière.", "Conduisons-nous honnêtement, comme en plein jour, sans orgies ni ivrognerie, sans immoralité ni débauche, sans dispute ni jalousie.", "Mais revêtez-vous du Seigneur Jésus-Christ et ne vous préoccupez pas de votre nature propre pour satisfaire ses convoitises."], "Colossiens 3": ["Si donc vous êtes ressuscités avec Christ, recherchez les choses d'en haut, où Christ est assis à la droite de Dieu.", "Attachez-vous aux réalités d'en haut, et non à celles qui sont sur la terre.", "En effet, vous avez connu la mort et votre vie est cachée avec Christ en Dieu.", "Quand Christ, notre vie, apparaîtra, alors vous apparaîtrez aussi avec lui dans la gloire.", "Faites donc mourir en vous ce qui est terrestre: l’immoralité sexuelle, l'impureté, les passions, les mauvais désirs et la soif de posséder, qui est une idolâtrie.", "C'est à cause de cela que la colère de Dieu vient [sur les hommes rebelles].", "Vous aussi autrefois, lorsque vous viviez parmi eux, vous marchiez dans ces péchés.", "Mais maintenant, renoncez à tout cela, à la colère, à la fureur, à la méchanceté, à la calomnie, aux grossièretés qui pourraient sortir de votre bouche.", "Ne vous mentez pas les uns aux autres, car vous vous êtes dépouillés du vieil homme et de ses manières d’agir,", "vous avez revêtu l'homme nouveau qui se renouvelle pour parvenir à la vraie connaissance, conformément à l'image de celui qui l'a créé.", "Il n'y a plus ni Juif ni non-Juif, ni circoncis ni incirconcis, ni étranger, ni sauvage, ni esclave ni homme libre, mais Christ est tout et en tous.", "Ainsi donc, en tant qu’êtres choisis par Dieu, saints et bien-aimés, revêtez-vous de sentiments de compassion, de bonté, d'humilité, de douceur, de patience.", "Supportez-vous les uns les autres et, si l'un de vous a une raison de se plaindre d’un autre, pardonnez-vous réciproquement. Tout comme Christ vous a pardonné, pardonnez-vous aussi.", "Mais par-dessus tout cela, revêtez-vous de l'amour, qui est le lien de la perfection.", "Que la paix de Christ, à laquelle vous avez été appelés pour former un seul corps, règne dans votre cœur. Et soyez reconnaissants.", "Que la parole de Christ habite en vous dans toute sa richesse! Instruisez-vous et avertissez-vous les uns les autres en toute sagesse par des psaumes, par des hymnes, par des cantiques spirituels, chantez pour le Seigneur de tout votre cœur sous l'inspiration de la grâce.", "Et quoi que vous fassiez, en parole ou en acte, faites tout au nom du Seigneur Jésus en exprimant par lui votre reconnaissance à Dieu le Père."], "Romains 14": ["Accueillez celui qui est faible dans la foi sans discuter ses opinions.", "L'un a la conviction de pouvoir manger de tout; l'autre, qui est faible dans la foi, ne mange que des légumes.", "Que celui qui mange de tout ne méprise pas celui qui ne le fait pas, et que celui qui ne mange pas de tout ne juge pas celui qui le fait, car Dieu l'a accueilli.", "Qui es-tu pour juger le serviteur d'un autre? Qu'il tienne bon ou qu'il tombe, cela regarde son seigneur. Mais il tiendra bon, car Dieu a le pouvoir de l'affermir.", "L'un fait une différence entre les jours, un autre les estime tous égaux. Que chacun ait dans son esprit une pleine conviction.", "Celui qui fait une distinction entre les jours le fait pour le Seigneur [et celui qui ne fait pas de distinction le fait aussi pour le Seigneur]. Celui qui mange de tout, c’est pour le Seigneur qu’il le fait, puisqu’il exprime sa reconnaissance à Dieu. Celui qui ne mange pas de tout le fait aussi pour le Seigneur, et il est reconnaissant envers Dieu.", "En effet, aucun de nous ne vit pour lui-même et aucun ne meurt pour lui-même:", "si nous vivons, c'est pour le Seigneur que nous vivons, et si nous mourons, c'est pour le Seigneur que nous mourons. Ainsi, soit que nous vivions, soit que nous mourions, nous appartenons au Seigneur.", "En effet, Christ est mort et [il est ressuscité,] il est revenu à la vie pour être le Seigneur des morts et des vivants.", "Mais toi, pourquoi juges-tu ton frère? Ou toi, pourquoi méprises-tu ton frère? Nous comparaîtrons tous, en effet, devant le tribunal de Christ,", "car il est écrit: Je suis vivant, dit le Seigneur, chacun pliera le genou devant moi et toute langue rendra gloire à Dieu.", "Ainsi donc, chacun de nous rendra compte à Dieu pour lui-même.", "Ne nous jugeons donc plus les uns les autres, mais veillez plutôt à ne pas placer d’obstacle ou de piège devant votre frère.", "Je sais et je suis convaincu dans le Seigneur Jésus que rien n'est impur en soi, mais si quelqu’un considère telle chose comme impure, alors elle est impure pour lui.", "Si ton frère est attristé à cause de ce que tu manges, tu ne marches plus selon l'amour. Ne cause pas, par ta nourriture, la perte de celui pour lequel Christ est mort.", "Que ce qui est bon pour vous ne devienne pas un sujet de calomnie.", "En effet, le royaume de Dieu, ce n'est pas le manger et le boire, mais la justice, la paix et la joie, par le Saint-Esprit.", "Celui qui sert Christ de cette manière est agréable à Dieu et approuvé des hommes.", "Ainsi donc, recherchons ce qui contribue à entretenir la paix et à nous faire grandir mutuellement dans la foi.", "Pour de la nourriture, ne détruis pas l'œuvre de Dieu. Certes, tout est pur, mais il est mal de manger quelque chose si cela représente un obstacle pour quelqu’un.", "Il est bien de ne pas manger de viande, de ne pas boire de vin et de t'abstenir de ce qui peut être pour ton frère un obstacle, [un piège ou une source de faiblesse].", "Cette foi que tu as, garde-la pour toi devant Dieu. Heureux celui qui ne se condamne pas lui-même par ce qu'il approuve!", "Mais celui qui a des doutes au sujet de ce qu'il mange est condamné, parce qu'il n'agit pas par une conviction de foi. Tout ce qui ne provient pas d’une conviction de foi est péché."], "Romains 15": ["Nous qui sommes forts, nous avons le devoir de supporter les faiblesses de ceux qui ne le sont pas et de ne pas rechercher ce qui nous plaît.", "Que chacun de nous cherche à plaire à son prochain pour son bien, en vue de le faire grandir dans la foi.", "En effet, Christ n'a pas recherché ce qui lui plaisait, mais, comme il est écrit, les injures de ceux qui t'insultent sont tombées sur moi.", "Or tout ce qui a été écrit d'avance l'a été pour notre instruction afin que, par la persévérance et par le réconfort que donnent les Ecritures, nous possédions l'espérance.", "Que le Dieu de la persévérance et du réconfort vous donne de vivre en plein accord les uns avec les autres comme le veut Jésus-Christ,", "afin que tous ensemble, d'une seule voix, vous rendiez gloire au Dieu et Père de notre Seigneur Jésus-Christ.", "Accueillez-vous donc les uns les autres comme Christ vous a accueillis, pour la gloire de Dieu.", "J’affirme [en effet] que [Jésus-]Christ est devenu le serviteur des circoncis pour prouver que Dieu est vrai en confirmant les promesses faites à leurs ancêtres.", "Quant aux non-Juifs, ils célèbrent Dieu à cause de sa bonté, comme le dit l’Ecriture: C'est pourquoi je te louerai parmi les nations et je chanterai à la gloire de ton nom.", "Il est dit encore: Nations, réjouissez-vous avec son peuple!", "et encore: Louez le Seigneur, vous toutes les nations, célébrez-le, vous tous les peuples!", "Esaïe dit aussi: Il paraîtra, le rejeton d'Isaï, il se lèvera pour régner sur les nations; les nations espéreront en lui", "Que le Dieu de l'espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous débordiez d’espérance, par la puissance du Saint-Esprit!", "En ce qui vous concerne, mes frères et sœurs, je suis personnellement convaincu que vous êtes pleins de bonnes dispositions, remplis de toute connaissance et capables de vous avertir les uns les autres.", "Cependant, [frères et sœurs,] c’est avec une certaine audace que je vous ai écrit par endroits, comme pour réveiller vos souvenirs, et cela à cause de la grâce que Dieu m'a faite", "d'être serviteur de Jésus-Christ pour les non-Juifs. Je m'acquitte ainsi du service sacré de la prédication de l'Evangile de Dieu afin que les non-Juifs soient une offrande agréable, devenue sainte par l’action de l'Esprit saint.", "Je peux donc me montrer fier en Jésus-Christ de l'œuvre de Dieu.", "En effet, je n'oserais rien mentionner si Christ ne l’avait pas accompli par moi pour amener les non-Juifs à l'obéissance par la parole et par les actes,", "par la puissance des signes et des prodiges et par la puissance de l'Esprit de Dieu. Ainsi, depuis Jérusalem et en rayonnant jusqu'en Illyrie, j'ai abondamment propagé l'Evangile de Christ.", "Je me suis fait un point d'honneur d'annoncer l'Evangile là où Christ n'avait pas été annoncé, afin de ne pas construire sur les fondations posées par un autre, mais comme il est écrit:", "Ceux à qui il n'avait pas été annoncé verront, et ceux qui n'en avaient pas entendu parler comprendront.", "C'est aussi ce qui m'a souvent empêché d'aller chez vous.", "Mais maintenant, comme je n'ai plus rien qui me retienne dans ces régions et que, depuis bien des années, j'ai le vif désir de vous rendre visite,", "[je le ferai] quand je me rendrai en Espagne. J'espère en effet vous voir en passant et recevoir votre aide pour me rendre là-bas une fois que j'aurai satisfait, du moins en partie, mon désir d'être avec vous.", "Maintenant je vais à Jérusalem pour servir les saints.", "En effet, les Eglises de la Macédoine et l'Achaïe ont bien voulu organiser une collecte en faveur de ceux qui sont pauvres parmi les saints de Jérusalem.", "Elles l'ont bien voulu et elles le leur devaient, car si les non-Juifs ont eu part aux avantages spirituels des Juifs, ils doivent aussi les assister dans leurs besoins matériels.", "Dès que j'aurai réglé cette affaire et que je leur aurai remis ces dons, je partirai pour l'Espagne et je passerai chez vous.", "Je sais qu'en venant vous rendre visite, c'est avec une pleine bénédiction de [l'Evangile de] Christ que je le ferai.", "Je vous en supplie, frères et sœurs, par notre Seigneur Jésus-Christ et par l'amour de l'Esprit, combattez avec moi en adressant à Dieu des prières en ma faveur.", "Priez afin que je sois protégé des incrédules de la Judée et que l’aide que j'apporte à Jérusalem soit bien accueillie par les saints.", "Ainsi je pourrai venir chez vous dans la joie, si c'est la volonté de Dieu, et trouver un peu de repos au milieu de vous.", "Que le Dieu de la paix soit avec vous tous! Amen!"]};

const BROKER_LIST = QS.get('broker') ? QS.get('broker').split(',') : BROKERS;
const BASE = 'qbsalves/' + ROOM;
const PBASE = 'qbperso/romains-2026';   // suivi des apps perso
const PERSO = {};
const store = LOCAL ? sessionStorage : localStorage;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clone = o => JSON.parse(JSON.stringify(o));
const V = (t, n) => TEXTES[t][n - 1];
const clean = s => s.replace(/[\[\]]/g, '');
const toks = s => s.split(/\s+/).filter(Boolean);
const core = w => w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const SHORT = { 'Romains 2': 'Rm 2', 'Romains 12': 'Rm 12', 'Romains 13': 'Rm 13', 'Colossiens 3': 'Col 3', 'Romains 14': 'Rm 14', 'Romains 15': 'Rm 15' };
const RXC = {};
function rx(r, cs) { const k = r + '|' + !!cs; return RXC[k] || (RXC[k] = new RegExp(`(?<![\\p{L}])(?:${r})(?![\\p{L}])`, 'gu' + (cs ? '' : 'i'))); }
const occ = (t, n, r, cs) => (clean(V(t, n)).match(rx(r, cs)) || []).length;
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const plural = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);
const motTxt = l => l.includes(' / ') ? 'le mot ' + l.split(' / ').map(x => `« ${x} »`).join(' ou ') : (/ /.test(l.replace(/ \(.*\)$/, '')) ? 'l’expression' : 'le mot') + ` « ${l} »`;
const fmtV = ns => (ns.length > 1 ? 'Versets ' : 'Verset ') + ns.join(', ');
const STOP = new Set('alors aussi autres autre avant avec avoir cela celle celles celui ceux cette chacun chose comme dans depuis donc elles encore entre être leurs leur même mêmes moins notre nous parce pour pourquoi quand quelque quelqu sans selon sont tous toute toutes tout vers votre vous ainsi puisque était sera seront avons avez êtes soient soyez point quoi rien très jusqu'.split(' '));

// ───────────── état ─────────────
let ROLE = null, ME = null;
let CFG = { ts: 0, prog: clone(PROGRESSION), visible: QUESTION_VISIBLE, duree: DUREE_SALVE, salve: 1, salveFin: 0 };
const ST = {};          // état de chaque jeune (publié par les coachs)
let VIEW = { y: null, set: false };
let net = null, ready = false;
const lastSeen = {};

const progOf = (J, cfg = CFG) => TEXTE_DE[J].map(t => ({ t, k: Math.max(0, Math.min(+((cfg.prog[J] || {})[t]) || 0, TEXTES[t].length)) }));
const multi = J => TEXTE_DE[J].length > 1;
const coachIndex = c => COACHS.indexOf(c);
const jeuneDe = (c, s) => JEUNES[(coachIndex(c) + s - 1) % JEUNES.length];
const coachDe = (j, s) => COACHS[((JEUNES.indexOf(j) - (s - 1)) % 5 + 5) % 5];
const coachDe_unused = (j, s) => COACHS[(JEUNES.indexOf(j) - (s - 1) % 5 + 10) % 5];

// ═════════════ GÉNÉRATION D'UNE SÉRIE ═════════════
const NOMS_DIEU = [['Dieu', 'Dieu'], ['Seigneur', 'Seigneur'], ['Jésus-Christ', 'Jésus-Christ'], ['Christ', '(?<!Jésus-)Christ'], ['Jésus', 'Jésus(?!-)'], ['Saint-Esprit', 'Saint-Esprit'], ['Esprit', '(?<!Saint-)Esprit'], ['Père', 'Père'], ['Eternel', 'Eternel']];
function scopeTxt(t, k, J) {
  const full = k >= TEXTES[t].length; const lab = multi(J) ? ' de ' + t : '';
  return full ? (multi(J) ? ' dans ' + t : ' dans le chapitre') : ` dans les versets 1 à ${k}${lab}`;
}
const labT = (J, t) => multi(J) ? ` (${SHORT[t]})` : '';
function numOpts(ans) {
  const c = new Set([ans]); const pool = shuffle([ans - 2, ans - 1, ans + 1, ans + 2, ans + 3, ans + 4].filter(x => x >= 0));
  for (const x of pool) { if (c.size >= 4) break; c.add(x); }
  let x = ans + 5; while (c.size < 4) c.add(x++);
  return [...c].map(String);   // la bonne réponse en premier (mcq trie ensuite)
}
function mcq(sec, q, opts, rIdx, extra) {
  const order = shuffle(opts.map((o, i) => i));
  const numeric = opts.every(o => /^\d+$/.test(o));
  const ord = numeric ? opts.map((o, i) => i).sort((a, b) => +opts[a] - +opts[b]) : order;
  return Object.assign({ sec, q, opts: ord.map(i => opts[i]), r: ord.indexOf(rIdx) }, extra || {});
}
function termStats(t, k, term) {
  const [l, r, cs] = term; const re = r || escRe(l);
  const vs = []; let tot = 0;
  for (let n = 1; n <= k; n++) { const c = occ(t, n, re, cs); if (c) { vs.push(n); tot += c; } }
  return { l: l.replace(/\|/g, ' / '), vs, tot };
}
function addLab(s, J, t) { if (!multi(J)) return s; const m = s.match(/^(.*?)(\s*[?…])$/); return m ? `${m[1]} [${SHORT[t]}]${m[2]}` : `${s} [${SHORT[t]}]`; }
function applyTrap(v, o, r) { const i = v.indexOf(o); return i < 0 ? null : v.slice(0, i) + r + v.slice(i + o.length); }

function buildSerie(J, cfg) {
  const P = progOf(J, cfg).filter(x => x.k > 0);
  if (!P.length) return [];
  const learnedAll = P.flatMap(({ t, k }) => Array.from({ length: k }, (_, i) => [t, i + 1]));
  const isL = (t, n) => P.some(x => x.t === t && n <= x.k);
  const out = {};
  const usedRec = new Set();
  const recite = (t, n) => ({ sec: 'Récitation', q: `Récite-moi le verset ${n}${labT(J, t)}.`, verses: [[t, n]], kind: 'recite' });
  const pickVerses = (cnt) => { const pool = shuffle(learnedAll.filter(([t, n]) => !usedRec.has(t + n))); return pool.slice(0, cnt).map(x => { usedRec.add(x[0] + x[1]); return x; }); };

  // 1. Récitation
  out.rec = pickVerses(Math.min(6, learnedAll.length)).map(([t, n]) => recite(t, n));

  // 2-3. Termes
  const stats = shuffle(P.flatMap(({ t, k }) => (BANQUE[t].termes || []).map(term => ({ t, ...termStats(t, k, term) })).filter(s => s.vs.length)));
  const used = new Set();
  const take = (filter, cnt) => { const r = []; for (const s of stats) { if (r.length >= cnt) break; const key = s.t + s.l; if (used.has(key) || !filter(s)) continue; used.add(key); r.push(s); } return r; };
  const occTxt = s => s.tot > s.vs.length ? ` (${s.tot} fois)` : '';
  out.ou = take(s => s.vs.length <= 3, 8).map(s => ({ sec: 'Récite-moi le ou les versets où il y a le mot…', q: `Récite-moi le ou les versets où il y a ${motTxt(s.l)}${labT(J, s.t)}.`, ans: fmtV(s.vs) + occTxt(s), verses: s.vs.map(n => [s.t, n]) }));
  out.num = take(s => s.vs.length <= 5, 8).map(s => ({ sec: 'Dis-moi le numéro du verset où il y a le mot…', q: `Dis-moi le numéro du ou des versets où il y a ${motTxt(s.l)}${labT(J, s.t)}.`, ans: fmtV(s.vs) + occTxt(s) }));

  // 4. Comptage
  const cmp = [];
  for (const { t, k } of P) {
    const sc = scopeTxt(t, k, J); let zeroDone = false;
    for (const c of shuffle(BANQUE[t].comptes)) {
      if (c.dieu) {
        const parts = NOMS_DIEU.map(([lab, r]) => { let n = 0; for (let i = 1; i <= k; i++) n += occ(t, i, r, true); return [lab, n]; }).filter(x => x[1]);
        const tot = parts.reduce((s, x) => s + x[1], 0); if (!tot) continue;
        cmp.push(mcq('Comptage / fréquence de mots', `Combien de fois les noms de Dieu (Dieu, Seigneur, Christ, Jésus, Esprit, Père…) apparaissent-ils${sc} ?`, numOpts(tot), 0, { ans: `${tot} fois (${parts.map(x => x[0] + ' : ' + x[1]).join(', ')})` }));
        continue;
      }
      const vs = []; let tot = 0;
      for (let i = 1; i <= k; i++) { const n = occ(t, i, c.r, c.cs); if (n) { vs.push(i); tot += n; } }
      if (c.zero) { if (zeroDone || tot) continue; zeroDone = true; }
      else if (!tot) continue;
      if (c.versets) cmp.push(mcq('Comptage / fréquence de mots', `Dans combien de versets apparaît ${c.l}${sc} ?`, numOpts(vs.length), 0, { ans: `${plural(vs.length, 'verset')}${vs.length ? ' (v.' + vs.join(', ') + ')' : ''}` }));
      else cmp.push(mcq('Comptage / fréquence de mots', `Combien de fois ${c.l} ${/^les /.test(c.l) ? 'apparaissent-ils' : 'apparaît-il'}${sc} ?`, numOpts(tot), 0, { ans: `${plural(tot, 'fois', 'fois')}${vs.length ? ' (v.' + vs.join(', ') + ')' : ''}` }));
    }
  }
  // début de versets (nouveauté)
  const debuts = [];
  for (const { t, k } of P) {
    const fw = {}; for (let n = 1; n <= k; n++) { const w = core(toks(V(t, n))[0]); (fw[norm(w)] = fw[norm(w)] || { w, ns: [] }).ns.push(n); }
    const rep = Object.values(fw).filter(x => x.ns.length >= 2 && !['le', 'la', 'les', 'l', 'un', 'une', 'des', 'de', 'du', 'il', 'ils', 'elle', 'et'].includes(norm(x.w)));
    if (rep.length) {
      const x = rnd(rep); const others = shuffle(Object.values(fw).filter(y => y !== x).map(y => y.w)).slice(0, 3);
      const extra = ['Et', 'Mais', 'Car', 'Que', 'En', 'Ainsi', 'Toi', 'Ne', 'Il'].filter(w => norm(w) !== norm(x.w) && !others.map(norm).includes(norm(w)));
      while (others.length < 3) others.push(extra.shift());
      debuts.push(mcq('Comptage / fréquence de mots', `Quel mot commence à la fois les versets ${x.ns.slice(0, 4).join(', ')}${labT(J, t)} ?`, [x.w, ...others], 0, { ans: `« ${x.w} » (versets ${x.ns.join(', ')})` }));
    }
  }
  out.cmp = shuffle(cmp).slice(0, multi(J) ? 7 : 6).concat(debuts.slice(0, 1));

  // 5. Version correcte + bonne fin
  const ver = [];
  const candV = shuffle(learnedAll.filter(([t, n]) => ((PIEGES[t] || {})[n] || []).length >= 3)).sort((a, b) => (V(a[0], a[1]).length > 230) - (V(b[0], b[1]).length > 230));
  for (const [t, n] of candV) {
    if (ver.length >= 3) break;
    const v = V(t, n); const vars = shuffle(PIEGES[t][n]).map(([o, r]) => applyTrap(v, o, r)).filter(Boolean).filter((x, i, a) => x !== v && a.indexOf(x) === i).slice(0, 3);
    if (vars.length < 3) continue;
    ver.push(mcq('Reconnaissance de la version correcte', `Quelle est la version correcte du verset ${n}${labT(J, t)} ?`, [v, ...vars].map(x => '« ' + x + ' »'), 0, { kind: 'version' }));
  }
  const endOf = v => { const w = toks(v); let cut = -1; for (let i = w.length - 4; i >= 3; i--) if (/[,;:]$/.test(w[i - 1])) { cut = i; break; } if (cut < 0 || w.length - cut > 12) cut = Math.max(3, w.length - 6); return { start: w.slice(0, cut).join(' '), end: w.slice(cut).join(' ') }; };
  for (const [t, n] of shuffle(learnedAll.filter(([t, n]) => toks(V(t, n)).length >= 10)).slice(0, 6)) {
    const v = V(t, n); const { start, end } = endOf(v); const opts = [end];
    for (const [o, r] of shuffle((PIEGES[t] || {})[n] || [])) { if (opts.length >= 4) break; const e2 = applyTrap(end, o, r); if (e2 && !opts.includes(e2)) opts.push(e2); }
    for (const [t2, n2] of shuffle(learnedAll)) { if (opts.length >= 4) break; if (t2 !== t || n2 === n) continue; const e2 = endOf(V(t2, n2)).end; if (!opts.includes(e2) && toks(e2).length >= 3) opts.push(e2); }
    if (opts.length < 4) continue;
    const st = toks(start); const deb = st.length > 8 ? '… ' + st.slice(-6).join(' ') : start;
    ver.push(mcq('Reconnaissance de la version correcte', `Quelle est la bonne fin du verset ${n}${labT(J, t)} ? « ${deb} … »`, opts.map(x => '« ' + x + ' »'), 0, { verses: [[t, n]] }));
    break;
  }
  out.ver = ver;

  // 6-8. Compréhension, liens, contexte
  const okRefs = (q, t) => q.v.every(x => Array.isArray(x) ? isL(x[0], x[1]) : isL(t, x));
  const fromBank = (key, cnt, sec) => shuffle(P.flatMap(({ t }) => (BANQUE[t][key] || []).filter(q => okRefs(q, t)).map(q => ({ q, t })))).slice(0, cnt)
    .map(({ q, t }) => mcq(sec, addLab(q.q, J, t), q.o, q.r, { note: q.n }));
  out.compr = fromBank('compr', 8, 'Compréhension de contenu');
  let liens = fromBank('liens', multi(J) ? 2 : 3, 'Lien interne');
  if (multi(J)) liens = liens.concat(shuffle(LIENS_DEUX_TEXTES.filter(q => okRefs(q))).slice(0, 2).map(q => mcq('Lien entre les deux textes', q.q, q.o, q.r)));
  out.liens = liens;
  const ctxPool = []; const seenQ = new Set();
  for (const t of TEXTE_DE[J]) for (const q of shuffle(BANQUE[t].contexte)) if (!seenQ.has(q.q)) { seenQ.add(q.q); ctxPool.push(q); }
  out.ctx = (multi(J) ? [...shuffle(BANQUE['Romains 13'].contexte).slice(0, 2), ...shuffle(BANQUE['Colossiens 3'].contexte).slice(0, 2)] : ctxPool.slice(0, 3))
    .map(q => mcq('Connaissance contextuelle / historique', q.q, q.o, q.r, { note: q.n }));

  // 9. Mot absent
  const abs = [];
  for (const { t, k } of P) {
    const nch = k >= 9 ? 3 : k >= 4 ? 2 : 1; const size = Math.ceil(k / nch);
    for (let c = 0; c < nch; c++) {
      const a = c * size + 1, b = Math.min(k, (c + 1) * size); if (a > b) continue;
      const count = (w, x, y) => { let s = 0; for (let n = x; n <= y; n++) s += occ(t, n, escRe(w) + 's?'); return s; };
      const sal = shuffle(BANQUE[t].saillants);
      const present = sal.filter(w => count(w, a, b) > 0);
      if (present.length < 3) continue;
      const absBest = sal.filter(w => !count(w, a, b) && count(w, 1, k) > 0);
      const absAny = sal.filter(w => !count(w, a, b));
      const ab = absBest.length ? rnd(absBest) : absAny.length ? rnd(absAny) : null; if (!ab) continue;
      const where = []; for (let n = 1; n <= k; n++) if (occ(t, n, escRe(ab) + 's?')) where.push(n);
      const cap = w => w[0].toUpperCase() + w.slice(1);
      abs.push(mcq('Mot absent', `Quel mot n’apparaît pas dans les versets ${a} à ${b}${labT(J, t)} ?`, [ab, ...present.slice(0, 3)].map(cap), 0, { ans: `« ${cap(ab)} »` + (where.length ? ` (on le trouve au${where.length > 1 ? 'x versets ' : ' verset '}${where.join(', ')})` : '') }));
    }
  }
  out.abs = shuffle(abs).slice(0, 3);

  // 10. Ordre des mots dans un verset
  const perm3 = (arr) => { const res = [arr]; const seen = new Set([arr.join('|')]); for (let g = 0; g < 60 && res.length < 4; g++) { const p = shuffle(arr); if (!seen.has(p.join('|'))) { seen.add(p.join('|')); res.push(p); } } return res; };
  const ordV = [];
  for (const [t, n] of shuffle(learnedAll)) {
    if (ordV.length >= 2) break;
    const ws = []; const seen = new Set();
    for (const w of toks(clean(V(t, n))).map(core)) { const k2 = norm(w); if (w.length >= 5 && /^\p{L}+$/u.test(w) && !STOP.has(k2) && !seen.has(k2)) { seen.add(k2); ws.push(w); } }
    if (ws.length < 4) continue;
    const m = ws.length >= 6 && Math.random() < .5 ? 4 : 3;
    const idx = shuffle(ws.map((_, i) => i)).slice(0, m).sort((a, b) => a - b); const sel = idx.map(i => ws[i].toLowerCase());
    const ps = perm3(sel); if (ps.length < 4) continue;
    ordV.push(mcq('Ordre des mots (verset)', `Dans quel ordre ces mots apparaissent-ils dans le verset ${n}${labT(J, t)} ?`, ps.map(p => p.join(' – ')), 0, { verses: [[t, n]] }));
  }
  out.ordV = ordV;

  // 11. Ordre dans le passage
  const ordP = [];
  for (const { t, k } of shuffle(P)) {
    if (k < 4) continue;
    const firstV = {}; const cnt = {};
    for (let n = 1; n <= k; n++) for (const w of toks(clean(V(t, n))).map(core)) { const kk = norm(w); if (w.length < 6 || !/^\p{L}+$/u.test(w) || STOP.has(kk)) continue; cnt[kk] = (cnt[kk] || 0) + 1; if (!firstV[kk]) firstV[kk] = { w: w.toLowerCase(), n }; }
    const hapax = Object.keys(cnt).filter(x => cnt[x] === 1).map(x => firstV[x]);
    for (let g = 0; g < 2 && ordP.length < 2; g++) {
      const byV = {}; hapax.forEach(h => (byV[h.n] = byV[h.n] || []).push(h));
      const vs = shuffle(Object.keys(byV).map(Number)).slice(0, 3).sort((a, b) => a - b); if (vs.length < 3) break;
      const sel = vs.map(n => rnd(byV[n]));

    }
  }
  out.ordP = ordP;

  // Assemblage avec récitations intercalées (+ « verset suivant », nouveauté)
  const body = [...out.ou, ...out.num, ...out.cmp, ...out.ver, ...out.compr, ...out.liens, ...out.ctx, ...out.abs, ...out.ordV, ...out.ordP];
  const list = [...out.rec]; let since = 0;
  for (const q of body) {
    list.push(q); since++;
    if (since >= 5) {
      since = 0;
      if (Math.random() < .3) {
        const cand = shuffle(learnedAll.filter(([t, n]) => isL(t, n + 1)));
        if (cand.length) { const [t, n] = cand[0]; const w = toks(V(t, n)); list.push({ sec: 'Récitation', kind: 'suivant', q: `Récite-moi le verset qui suit celui-ci${labT(J, t)} : « ${w.slice(0, 7).join(' ')}${w.length > 7 ? '…' : ''} »`, verses: [[t, n + 1]], note: `C’est le verset ${n + 1} (on vient de citer le v.${n}).` }); continue; }
      }
      const r = pickVerses(1)[0]; if (r) list.push(recite(r[0], r[1]));
    }
  }
  return list;
}

class MqttNet {
  constructor(onMsg, onStatus) { this.onMsg = onMsg; this.onStatus = onStatus; this.clients = []; }
  connect() {
    if (typeof mqtt === 'undefined') { this.onStatus(); return; }
    this.clients = BROKER_LIST.map(url => {
      const c = mqtt.connect(url, { clientId: 'qs_' + Math.random().toString(36).slice(2, 10), clean: true, reconnectPeriod: 2500, connectTimeout: 10000, keepalive: 30 });
      c.on('connect', () => { c.subscribe(BASE + '/#', { qos: 1 }); if (ROLE === 'coach') c.subscribe(PBASE + '/#', { qos: 0 }); this.onStatus(); });
      c.on('message', (topic, payload) => { try { if (topic.startsWith(PBASE + '/')) onPerso(JSON.parse(payload.toString())); else this.onMsg(topic.slice(BASE.length + 1), JSON.parse(payload.toString())); } catch (e) {} });
      ['close', 'offline', 'reconnect'].forEach(ev => c.on(ev, () => this.onStatus()));
      c.on('error', () => {});
      return c;
    });
  }
  count() { return this.clients.filter(c => c.connected).length; }
  publish(sub, msg, retain) { const s = JSON.stringify(msg); for (const c of this.clients) if (c.connected) c.publish(BASE + '/' + sub, s, { qos: 1, retain: !!retain }); }
}
class LocalNet {
  constructor(onMsg, onStatus) { this.onMsg = onMsg; this.onStatus = onStatus; }
  connect() {
    this.ch = new BroadcastChannel(BASE); this.ch.onmessage = e => this.onMsg(e.data.sub, e.data.msg);
    setTimeout(() => { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('ret:' + BASE + '/')) { try { this.onMsg(k.slice(BASE.length + 5), JSON.parse(localStorage.getItem(k))); } catch (e) {} } } this.onStatus(); }, 50);
  }
  count() { return 1; }
  publish(sub, msg, retain) { if (retain) localStorage.setItem('ret:' + BASE + '/' + sub, JSON.stringify(msg)); this.ch.postMessage({ sub, msg }); }
}
function onPerso(m) { if (!m || !JEUNES.includes(m.J)) return; if (PERSO[m.J] && (PERSO[m.J].at || 0) > (m.at || 0)) return; PERSO[m.J] = m; if (VIEW.admin && VIEW.tab === 'suivi') render(); }
const ago = t => { if (!t) return 'jamais'; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? 'à l’instant' : s < 3600 ? 'il y a ' + Math.round(s / 60) + ' min' : s < 86400 ? 'il y a ' + Math.round(s / 3600) + ' h' : 'il y a ' + Math.round(s / 86400) + ' j'; };
function suiviHTML() {
  const C = { g: '#1f9d55', o: '#e08a00', r: '#d64545' };
  return JEUNES.map(j => { const m = PERSO[j];
    if (!m) return `<div class="card"><h2 style="margin:0">${esc(j)}</h2><p class="hint">Pas encore de données : ${esc(j)} n’a pas encore ouvert la nouvelle version de son app perso.</p></div>`;

  if (!ROLE) { app.innerHTML = loginHTML(); return; }
  const y = scrollY; const focusId = document.activeElement && document.activeElement.id;
  app.innerHTML = ROLE === 'coach' ? (VIEW.admin ? adminHTML() : VIEW.y ? coachSession(VIEW.y) : coachHome()) : jeuneHTML();
  if (focusId === 'visible' || focusId === 'duree') { const f = document.getElementById(focusId); f && f.focus(); }
  scrollTo(0, y);
}
setInterval(() => { document.querySelectorAll('.timer[data-fin]').forEach(el => { const left = +el.dataset.fin - Date.now(); el.textContent = fmtLeft(left); el.classList.toggle('late', left < 30000); }); if (CFG.salveFin && Date.now() > CFG.salveFin && VIEW.endShown !== CFG.salveFin) { VIEW.endShown = CFG.salveFin; render(); } }, 500);

// ───── Actions ─────
const ACT = {
  login(d) { store.setItem('qs_role', d.r); store.setItem('qs_me', d.n); boot(); },
  logout() { store.removeItem('qs_role'); store.removeItem('qs_me'); location.href = location.pathname + (LOCAL ? '?local=1' : ''); },
  home() { VIEW.y = null; VIEW.admin = false; VIEW.confirmNew = false; render(); scrollTo(0, 0); },
  admin() { VIEW.admin = true; VIEW.y = null; render(); scrollTo(0, 0); },
  tab(d) { VIEW.tab = d.v; render(); },
  texte(d) { VIEW.texte = d.v; VIEW.cherche = ''; render(); },
  qj(d) { VIEW.qj = d.v; render(); },
  adminSerie(d) { const J = d.v; ST[J] = { J, serie: Date.now(), rev: 0, list: buildSerie(J, CFG), i: 0, phase: 'ask', res: {} }; pubEleve(J); },
  open(d) { VIEW.y = d.y; VIEW.admin = false; render(); scrollTo(0, 0); },
  ack() { VIEW.ack = VIEW.y + ST[VIEW.y].serie; render(); },
  salveNext() { CFG.salve = (CFG.salve || 1) + 1; CFG.salveFin = Date.now() + CFG.duree * 60000; VIEW.y = jeuneDe(ME, CFG.salve); pubCfg(); scrollTo(0, 0); },
  newSerie() {
    const J = VIEW.y; const old = ST[J];
    if (old && old.i > 0 && old.i < old.list.length && !VIEW.confirmNew) { VIEW.confirmNew = true; render(); return; }
    VIEW.confirmNew = false;
    ST[J] = { J, serie: Date.now(), rev: 0, list: buildSerie(J, CFG), i: 0, phase: 'ask', res: {} };
    VIEW.ack = J + ST[J].serie; pubEleve(J);
  },
  mark(d) { const s = ST[VIEW.y]; s.res[s.i] = { ok: d.ok === '1', essai: s.phase === 'retry' ? 2 : 1 }; s.phase = 'shown'; pubEleve(VIEW.y); },
  retry() { const s = ST[VIEW.y]; s.phase = 'retry'; pubEleve(VIEW.y); },
  next() { const s = ST[VIEW.y]; s.i++; s.phase = 'ask'; pubEleve(VIEW.y); scrollTo(0, 0); },
  skip() { const s = ST[VIEW.y]; if (!s.res[s.i]) s.res[s.i] = { skip: true }; s.i++; s.phase = 'ask'; pubEleve(VIEW.y); },
  prev() { const s = ST[VIEW.y]; s.i = Math.max(0, s.i - 1); s.phase = s.res[s.i] && !s.res[s.i].skip ? 'shown' : 'ask'; if (s.phase === 'ask') delete s.res[s.i]; pubEleve(VIEW.y); },
  salveGo() { CFG.salveFin = Date.now() + CFG.duree * 60000; pubCfg(); },
  salveStop() { CFG.salveFin = 0; pubCfg(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  e.preventDefault(); const f = ACT[b.dataset.act]; if (f) f(b.dataset);
});
document.addEventListener('change', e => {
  const t = e.target; if (ROLE !== 'coach') return;
  if (t.id === 'visible') { CFG.visible = t.checked; VIEW.set = true; pubCfg(); }
  else if (t.id === 'duree') { CFG.duree = Math.max(1, Math.min(30, +t.value || 5)); VIEW.set = true; pubCfg(); }
  else if (t.classList.contains('pg')) { (CFG.prog[t.dataset.p] = CFG.prog[t.dataset.p] || {})[t.dataset.t] = Math.max(0, Math.min(TEXTES[t.dataset.t].length, parseInt(t.value, 10) || 0)); VIEW.set = true; pubCfg(); }
});
document.addEventListener('input', e => { if (e.target.id === 'cherche') { VIEW.cherche = e.target.value; const pos = e.target.selectionStart; render(); const f = document.getElementById('cherche'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } } });
document.addEventListener('toggle', e => { if (e.target.id === 'setd') VIEW.set = e.target.open; if (e.target.id === 'hist') VIEW.hist = e.target.open; }, true);

function boot() {
  ROLE = store.getItem('qs_role'); ME = store.getItem('qs_me');
  const m = QS.get('moi'); if (m) { if (JEUNES.includes(m)) { ROLE = 'jeune'; ME = m; } else if (COACHS.includes(m)) { ROLE = 'coach'; ME = m; } }
  if (ROLE && !(ROLE === 'jeune' ? JEUNES : COACHS).includes(ME)) ROLE = null;
  if (!ROLE) { render(); return; }
  if (!net) {
    net = LOCAL ? new LocalNet(onMsg, () => render()) : new MqttNet(onMsg, () => { if (net.count() && !ready) setTimeout(() => { ready = true; render(); }, 1800); render(); });
    net.connect(); if (LOCAL) setTimeout(() => { ready = true; render(); }, 300);
  }
  render();
}
window.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
</script>
</body>
